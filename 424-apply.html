<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>424-350 E 2nd Avenue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#1a1a2e;--cream:#faf8f5;--gold:#c9a96e;--gold-light:#e8d5b0;
  --warm:#f5f0eb;--accent:#2d4a3e;--text:#3a3a4a;--text-light:#6b6b7b;
  --glass:rgba(255,255,255,0.85);--shadow:0 8px 32px rgba(0,0,0,0.08);
}
html{font-size:16px}
body{font-family:'Inter',sans-serif;color:var(--text);background:var(--cream);overflow-x:hidden;-webkit-font-smoothing:antialiased}

section{padding:6rem 5vw}
.page-title{font-family:'Playfair Display';font-weight:600;font-size:clamp(2.2rem,5vw,4.5rem);color:var(--ink);line-height:1.1;margin-bottom:2.5rem}

/* FORM */
form{display:grid;gap:2.5rem}
#adults{display:grid;gap:2.5rem}
.card{background:#fff;border-radius:12px;padding:2rem;box-shadow:var(--shadow)}
.card h3{font-family:'Playfair Display';font-size:1.2rem;color:var(--ink);margin-bottom:1rem;padding-bottom:0.8rem;border-bottom:2px solid var(--gold-light)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:1.5rem 2rem}
.field{display:flex;flex-direction:column;gap:0.5rem}
.field.wide{grid-column:1/-1}
.q{font-size:0.9rem;font-weight:500;color:var(--ink)}
.req{color:var(--gold)}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--cream);border:1px solid var(--gold-light);border-radius:4px;padding:0.8rem 1rem;width:100%}
textarea{min-height:6rem;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,110,0.25)}
input.error,textarea.error{border-color:#c0392b}
.choices{display:flex;flex-wrap:wrap;gap:0.6rem 1.5rem}
.choice{display:flex;align-items:center;gap:0.6rem;font-size:0.95rem;color:var(--text);cursor:pointer}
.choice input{accent-color:var(--gold);width:1.1rem;height:1.1rem;flex-shrink:0}

/* BUTTONS (from listing .cta-btn) */
.cta-btn{display:inline-block;padding:1rem 2.5rem;background:var(--gold);color:var(--ink);font-family:inherit;font-weight:600;font-size:0.95rem;letter-spacing:1px;text-transform:uppercase;text-decoration:none;border:none;border-radius:4px;cursor:pointer;transition:all 0.3s;justify-self:start}
.cta-btn:hover{background:var(--gold-light);transform:translateY(-2px);box-shadow:0 8px 24px rgba(201,169,110,0.3)}
.cta-btn.outline{background:transparent;box-shadow:inset 0 0 0 2px var(--gold)}
.cta-btn.outline:hover{background:var(--gold-light);box-shadow:inset 0 0 0 2px var(--gold),0 8px 24px rgba(201,169,110,0.3)}
.cta-btn:disabled{opacity:0.7;cursor:default;transform:none}
.submit-btn{display:inline-grid}
.submit-btn span{grid-area:1/1;visibility:hidden}
.submit-btn[data-state="idle"] [data-for="idle"],
.submit-btn[data-state="sending"] [data-for="sending"],
.submit-btn[data-state="error"] [data-for="error"]{visibility:visible}
.form-thank-you{background:#fff;border-radius:12px;padding:2rem;box-shadow:var(--shadow);font-family:'Playfair Display';font-size:1.5rem;color:var(--ink)}
</style>
</head>
<body>

<section>
<h1 class="page-title">424-350 E 2nd Avenue</h1>

<form id="applyForm" novalidate>

  <div class="card">
    <div class="fields">
      <div class="field wide"><label class="q" for="who">Who would live there?</label><textarea id="who" name="Who would live there?"></textarea></div>
      <div class="field"><label class="q" for="adultCount">How many adults?</label><input type="number" id="adultCount" name="How many adults?" min="1" inputmode="numeric"></div>
    </div>
  </div>

  <div id="adults">
    <div class="card">
      <h3>Adult 1</h3>
      <div class="fields">
        <div class="field"><label class="q" for="a1-name">Full name <span class="req">*</span></label><input type="text" id="a1-name" name="Adult 1: Full name" autocomplete="name" required></div>
        <div class="field"><label class="q" for="a1-phone">Phone <span class="req">*</span></label><input type="tel" id="a1-phone" name="Adult 1: Phone" autocomplete="tel" required></div>
        <div class="field"><label class="q" for="a1-email">Email <span class="req">*</span></label><input type="email" id="a1-email" name="Adult 1: Email" autocomplete="email" required></div>
        <div class="field"><label class="q" for="a1-work">Where you work or what business you run</label><input type="text" id="a1-work" name="Adult 1: Where you work or what business you run"></div>
        <div class="field"><label class="q" for="a1-job">Job</label><input type="text" id="a1-job" name="Adult 1: Job"></div>
        <div class="field"><label class="q" for="a1-time">How long you've worked there</label><input type="text" id="a1-time" name="Adult 1: How long you've worked there"></div>
        <div class="field"><label class="q" for="a1-income">Monthly income</label><input type="text" id="a1-income" name="Adult 1: Monthly income"></div>
      </div>
    </div>
  </div>

  <button type="button" class="cta-btn outline" id="addAdult">Add another adult</button>

  <div class="card">
    <div class="fields">
      <div class="field"><label class="q" for="moveIn">What move-in date do you want?</label><input type="date" id="moveIn" name="What move-in date do you want?"></div>
      <div class="field"><label class="q" for="stay">How long do you want to stay?</label><input type="text" id="stay" name="How long do you want to stay?"></div>
      <div class="field"><label class="q" for="pets">Pets: what kind and how many?</label><input type="text" id="pets" name="Pets: what kind and how many?"></div>
      <div class="field" role="group" aria-labelledby="q-smoke"><span class="q" id="q-smoke">Do you smoke or vape?</span>
        <div class="choices">
          <label class="choice"><input type="radio" name="Do you smoke or vape?" value="Yes">Yes</label>
          <label class="choice"><input type="radio" name="Do you smoke or vape?" value="No">No</label>
        </div>
      </div>
      <div class="field" role="group" aria-labelledby="q-car"><span class="q" id="q-car">Do you have a car for the parking spot?</span>
        <div class="choices">
          <label class="choice"><input type="radio" name="Do you have a car for the parking spot?" value="Yes">Yes</label>
          <label class="choice"><input type="radio" name="Do you have a car for the parking spot?" value="No">No</label>
        </div>
      </div>
      <div class="field wide"><label class="q" for="business">Will you run a business from the loft, with clients coming by?</label><input type="text" id="business" name="Will you run a business from the loft, with clients coming by?"></div>
      <div class="field wide"><label class="q" for="why">Why are you moving?</label><textarea id="why" name="Why are you moving?"></textarea></div>
    </div>
  </div>

  <div class="card">
    <div class="fields">
      <div class="field"><label class="q" for="addr">Current address</label><input type="text" id="addr" name="Current address" autocomplete="street-address"></div>
      <div class="field"><label class="q" for="addrTime">How long have you lived there?</label><input type="text" id="addrTime" name="How long have you lived there?"></div>
      <div class="field"><label class="q" for="curLL">Current landlord</label><input type="text" id="curLL" name="Current landlord"></div>
      <div class="field"><label class="q" for="curLLPhone">Current landlord's phone</label><input type="tel" id="curLLPhone" name="Current landlord's phone"></div>
      <div class="field"><label class="q" for="prevLL">Previous landlord</label><input type="text" id="prevLL" name="Previous landlord"></div>
      <div class="field"><label class="q" for="prevLLPhone">Previous landlord's phone</label><input type="tel" id="prevLLPhone" name="Previous landlord's phone"></div>
      <div class="field wide"><label class="choice"><input type="checkbox" name="OK to call my current and previous landlord">OK to call my current and previous landlord</label></div>
    </div>
  </div>

  <div class="card">
    <div class="fields">
      <div class="field wide"><label class="choice"><input type="checkbox" name="I'll send a recent pay stub or a letter from my employer">I'll send a recent pay stub or a letter from my employer</label></div>
      <div class="field wide" role="group" aria-labelledby="q-credit"><span class="q" id="q-credit">Credit</span>
        <div class="choices">
          <label class="choice"><input type="radio" name="Credit" value="OK to run a credit check">OK to run a credit check</label>
          <label class="choice"><input type="radio" name="Credit" value="I'll send my own free Equifax or TransUnion report">I'll send my own free Equifax or TransUnion report</label>
        </div>
      </div>
      <div class="field"><label class="q" for="sign">Sign: type your full name</label><input type="text" id="sign" name="Sign: type your full name"></div>
    </div>
  </div>

  <button type="submit" class="cta-btn submit-btn" data-state="idle"><span data-for="idle">Submit</span><span data-for="sending" aria-hidden="true">Sending...</span><span data-for="error" aria-hidden="true">Error, try again</span></button>

</form>
</section>

<template id="adultTpl">
    <div class="card">
      <h3>Adult __N__</h3>
      <div class="fields">
        <div class="field"><label class="q" for="a__N__-name">Full name</label><input type="text" id="a__N__-name" name="Adult __N__: Full name"></div>
        <div class="field"><label class="q" for="a__N__-phone">Phone</label><input type="tel" id="a__N__-phone" name="Adult __N__: Phone"></div>
        <div class="field"><label class="q" for="a__N__-email">Email</label><input type="email" id="a__N__-email" name="Adult __N__: Email"></div>
        <div class="field"><label class="q" for="a__N__-work">Where you work or what business you run</label><input type="text" id="a__N__-work" name="Adult __N__: Where you work or what business you run"></div>
        <div class="field"><label class="q" for="a__N__-job">Job</label><input type="text" id="a__N__-job" name="Adult __N__: Job"></div>
        <div class="field"><label class="q" for="a__N__-time">How long you've worked there</label><input type="text" id="a__N__-time" name="Adult __N__: How long you've worked there"></div>
        <div class="field"><label class="q" for="a__N__-income">Monthly income</label><input type="text" id="a__N__-income" name="Adult __N__: Monthly income"></div>
      </div>
    </div>
</template>

<script>
(function () {
  // Same Web3Forms key + send pattern as pietsuess.com (js/main.js)
  const KEY = '0f45da86-7dcf-4c66-8881-d7597d02d720';
  const form = document.getElementById('applyForm');
  const adults = document.getElementById('adults');
  const tpl = document.getElementById('adultTpl');
  const submitBtn = form.querySelector('.submit-btn');
  const sign = document.getElementById('sign');
  let count = 1;

  function setState(state) {
    submitBtn.dataset.state = state;
    submitBtn.querySelectorAll('span').forEach(s => {
      if (s.dataset.for === state) s.removeAttribute('aria-hidden');
      else s.setAttribute('aria-hidden', 'true');
    });
  }

  document.getElementById('addAdult').addEventListener('click', () => {
    count += 1;
    adults.insertAdjacentHTML('beforeend', tpl.innerHTML.replace(/__N__/g, count));
    adults.lastElementChild.querySelector('input').focus();
  });

  // A typed signature is needed when they OK the credit check
  form.querySelectorAll('input[name="Credit"]').forEach(r => r.addEventListener('change', () => {
    const picked = form.querySelector('input[name="Credit"]:checked');
    sign.required = !!picked && picked.value === 'OK to run a credit check';
    if (!sign.required) sign.classList.remove('error');
  }));

  // Every question in page order, so the email reads like the form
  function collect() {
    const body = {};
    for (const el of form.elements) {
      if (!el.name || el.name in body) continue;
      if (el.type === 'radio') {
        const picked = form.querySelector('input[type="radio"][name="' + el.name + '"]:checked');
        body[el.name] = picked ? picked.value : '';
      } else if (el.type === 'checkbox') {
        body[el.name] = el.checked ? 'Yes' : 'No';
      } else {
        body[el.name] = el.value.trim();
      }
    }
    return body;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    let valid = true;
    form.querySelectorAll('[required]').forEach(field => {
      const value = field.value.trim();
      if (!value) { valid = false; field.classList.add('error'); }
      if (field.type === 'email' && value && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
        valid = false; field.classList.add('error');
      }
    });

    if (!valid) {
      const firstError = form.querySelector('.error');
      if (firstError) firstError.focus();
      return;
    }

    setState('sending');
    submitBtn.disabled = true;

    try {
      const fields = collect();
      const body = Object.assign({
        access_key: KEY,
        subject: 'New message from 424-350 E 2nd Avenue',
        from_name: fields['Adult 1: Full name'],
        replyto: fields['Adult 1: Email']
      }, fields);

      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();

      if (data.success) {
        const thankYou = document.createElement('div');
        thankYou.className = 'form-thank-you';
        thankYou.textContent = 'Thank you! Your message has been sent.';
        form.style.display = 'none';
        form.parentNode.insertBefore(thankYou, form.nextSibling);
        thankYou.scrollIntoView({ block: 'center' });
      } else {
        setState('error');
        submitBtn.disabled = false;
      }
    } catch (err) {
      setState('error');
      submitBtn.disabled = false;
    }
  });

  form.addEventListener('input', (e) => {
    if (e.target.classList.contains('error')) e.target.classList.remove('error');
  });
})();
</script>
</body>
</html>
