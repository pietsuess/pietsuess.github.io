<title>Pop-Art – Piet Suess</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#0e0e10;color:#f4f1ea;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
main{padding:24px;width:100%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%}
.tile{display:block;background:#17171a;border-radius:4px;overflow:hidden;text-decoration:none;cursor:zoom-in;transition:transform .15s ease}
.tile:hover{transform:translateY(-2px)}
.tile img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#1f1f23}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:100;cursor:zoom-out;padding:24px}
.lightbox.open{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;display:block;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.lightbox .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.06);color:#fff;border:none;width:48px;height:48px;font-size:28px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:background .15s}
.lightbox .nav:hover{background:rgba(255,255,255,0.15)}
.lightbox .prev{left:24px}
.lightbox .next{right:24px}
.lightbox .close{position:absolute;top:24px;right:24px;background:rgba(255,255,255,0.06);color:#fff;border:none;width:40px;height:40px;font-size:22px;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center}
.lightbox .close:hover{background:rgba(255,255,255,0.15)}
.lightbox .counter{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:#9aa0a6;font-size:0.85rem;font-variant-numeric:tabular-nums}
</style>
</head>

<div class="lightbox" id="lb">
<button class="close" aria-label="Close">×</button>
<button class="nav prev" aria-label="Previous">‹</button>
<img id="lbImg" alt="">
<button class="nav next" aria-label="Next">›</button>
<div class="counter" id="lbCounter"></div>
</div>
<script>
const tiles = [...document.querySelectorAll(".tile")];
const lb = document.getElementById("lb");
const lbImg = document.getElementById("lbImg");
const lbCounter = document.getElementById("lbCounter");
let idx = 0;
function show(i) {
  idx = (i + tiles.length) % tiles.length;
  lbImg.src = tiles[idx].dataset.full;
  lbCounter.textContent = `${idx + 1} / ${tiles.length}`;
  lb.classList.add("open");
}
function close() { lb.classList.remove("open"); lbImg.src = ""; }
tiles.forEach((t, i) => { t.addEventListener("click", e => { e.preventDefault(); show(i); }); });
lb.querySelector(".close").addEventListener("click", e => { e.stopPropagation(); close(); });
lb.querySelector(".prev").addEventListener("click", e => { e.stopPropagation(); show(idx - 1); });
lb.querySelector(".next").addEventListener("click", e => { e.stopPropagation(); show(idx + 1); });
lb.addEventListener("click", e => { if (e.target === lb || e.target === lbImg) close(); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") close();
  else if (e.key === "ArrowLeft") show(idx - 1);
  else if (e.key === "ArrowRight") show(idx + 1);
});
</script>
