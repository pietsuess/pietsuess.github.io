<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ship Loadout Test</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    overflow-x: hidden;
  }
  #viewer {
    width: 100vw;
    height: 50vh;
    display: block;
    background: #000;
    border-bottom: 2px solid #ff44ff;
  }
  #panel {
    width: 100vw;
    min-height: 50vh;
    box-sizing: border-box;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    background: linear-gradient(180deg, #050010, #000);
  }
  .row {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 11px;
    line-height: 1.6;
    flex-wrap: wrap;
  }
  .label {
    color: #00ffcc;
    min-width: 110px;
  }
  .value {
    color: #ffcc66;
  }
  .stat-block {
    border: 1px solid #ff44ff;
    padding: 14px 16px;
    background: rgba(255, 68, 255, 0.04);
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 11px;
    border-bottom: 1px dashed rgba(255, 68, 255, 0.25);
  }
  .stat-row:last-child { border-bottom: none; }
  .k { color: #00ffcc; }
  .v { color: #ffcc66; }
  .weight-light { color: #44ff66; }
  .weight-medium { color: #ffcc44; }
  .weight-heavy { color: #ff4466; }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .menu-btn {
    background: #000;
    color: #fff;
    border: 1px solid #ff44ff;
    padding: 12px 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    border-radius: 0;
    width: 100%;
    max-width: 420px;
    background-image: linear-gradient(45deg, transparent 50%, #00ffcc 50%), linear-gradient(135deg, #00ffcc 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 12px) 50%;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
    padding-right: 36px;
  }
  .menu-btn:hover {
    background-color: #1a001a;
    border-color: #00ffcc;
  }
  .menu-btn:focus {
    outline: 2px solid #00ffcc;
    outline-offset: 2px;
  }
  h1 {
    font-size: 14px;
    color: #ff44ff;
    margin: 0 0 8px 0;
    letter-spacing: 2px;
  }
  .formula {
    font-size: 9px;
    color: #888;
    margin-top: 4px;
  }
</style>
</head>
<body>
<canvas id="viewer"></canvas>
<div id="panel">
  <h1>SHIP LOADOUT</h1>
  <div class="stat-block">
    <div class="stat-row"><span class="k">WEAPON</span><span class="v" id="vWeapon">GUN</span></div>
    <div class="stat-row"><span class="k">SHIELD</span><span class="v" id="vShield">NONE</span></div>
    <div class="stat-row"><span class="k">SPEED</span><span class="v" id="vSpeed">THRUSTER</span></div>
    <div class="stat-row"><span class="k">WEIGHT</span><span class="v" id="vWeight">1 / 15 (LIGHT)</span></div>
    <div class="stat-row"><span class="k">EFFECTIVE SPEED</span><span class="v" id="vEffSpeed">0.00</span></div>
    <div class="formula" id="formula">base 100 x mult 1.0 x (1 - 1 x 0.02)</div>
  </div>
  <div class="controls">
    <div class="row"><span class="label">WEAPON</span>
      <select id="selWeapon" class="menu-btn">
        <option value="0">NONE</option>
        <option value="1" selected>GUN</option>
        <option value="2">TWIN GUNS</option>
        <option value="3">LASERS</option>
        <option value="4">WAVE CANNON</option>
      </select>
    </div>
    <div class="row"><span class="label">SHIELD</span>
      <select id="selShield" class="menu-btn">
        <option value="0" selected>NONE</option>
        <option value="1">CERAMIC</option>
        <option value="2">STEEL</option>
        <option value="3">TITANIUM</option>
        <option value="4">TUNGSTEN</option>
        <option value="5">GRAPHENE</option>
      </select>
    </div>
    <div class="row"><span class="label">SPEED</span>
      <select id="selSpeed" class="menu-btn">
        <option value="0">NONE</option>
        <option value="1" selected>THRUSTER</option>
        <option value="2">AFTERBURNER</option>
        <option value="3">ION DRIVE</option>
        <option value="4">WARP DRIVE</option>
      </select>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const WEAPON_NAMES = ['NONE','GUN','TWIN GUNS','LASERS','WAVE CANNON'];
  const SHIELD_NAMES = ['NONE','CERAMIC','STEEL','TITANIUM','TUNGSTEN','GRAPHENE'];
  const SPEED_NAMES = ['NONE','THRUSTER','AFTERBURNER','ION DRIVE','WARP DRIVE'];
  const WEAPON_WEIGHTS = [0,1,2,2,4];
  const SHIELD_WEIGHTS = [0,1,3,4,6,2];
  const SPEED_MULT = [0.6,1.0,1.3,1.6,2.0];
  const BASE_SPEED = 100;

  const FLAME_PALETTES = [
    {inner:0xff8800, outer:0xffaa00, scale:0.4, pulse:false},
    {inner:0xff8800, outer:0xffaa00, scale:1.0, pulse:false},
    {inner:0xff6600, outer:0xffdd44, scale:1.3, pulse:false},
    {inner:0x00aaff, outer:0x88ddff, scale:1.5, pulse:false},
    {inner:0xcc44ff, outer:0xff66cc, scale:1.8, pulse:true}
  ];

  const SHIELD_STYLES = [
    null,
    {color:0xddddcc, opacity:0.18, scale:1.0, geo:'sphere'},
    {color:0xcccccc, opacity:0.28, scale:1.05, geo:'sphere'},
    {color:0x99ccff, opacity:0.35, scale:1.08, geo:'icosa'},
    {color:0x444444, opacity:0.55, scale:1.10, geo:'sphere'},
    {color:0xcc66ff, opacity:0.40, scale:1.06, geo:'sphere'}
  ];

  const canvas = document.getElementById('viewer');
  const renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  function resize(){
    const w = window.innerWidth;
    const h = Math.round(window.innerHeight * 0.5);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  const camera = new THREE.PerspectiveCamera(40, 2, 0.1, 500);
  camera.position.set(0, 4, 22);
  camera.lookAt(0, 0, 0);

  const ambient = new THREE.AmbientLight(0xffffff, 0.55);
  scene.add(ambient);
  const key = new THREE.DirectionalLight(0xffffff, 0.9);
  key.position.set(6, 10, 8);
  scene.add(key);
  const rim = new THREE.PointLight(0xff44ff, 1.2, 40);
  rim.position.set(-8, 4, -6);
  scene.add(rim);

  const starGeo = new THREE.BufferGeometry();
  const starCount = 500;
  const starPos = new Float32Array(starCount * 3);
  for (let i = 0; i < starCount; i++) {
    starPos[i*3]   = (Math.random()-0.5) * 200;
    starPos[i*3+1] = (Math.random()-0.5) * 120;
    starPos[i*3+2] = (Math.random()-0.5) * 200 - 60;
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({color:0xffffff, size:0.35, sizeAttenuation:true, transparent:true, opacity:0.7});
  scene.add(new THREE.Points(starGeo, starMat));

  const turntable = new THREE.Group();
  scene.add(turntable);
  const shipGroup = new THREE.Group();
  turntable.add(shipGroup);
  const bankGroup = new THREE.Group();
  shipGroup.add(bankGroup);

  const matBody = new THREE.MeshStandardMaterial({
    color:0xcc1155, emissive:0xff2266, emissiveIntensity:0.45,
    metalness:0.0, roughness:1.0, flatShading:true
  });
  const matUnder = new THREE.MeshStandardMaterial({
    color:0x880033, emissive:0xff0044, emissiveIntensity:0.2,
    metalness:0.0, roughness:1.0, flatShading:true
  });
  const matCockpit = new THREE.MeshStandardMaterial({
    color:0x00ffcc, emissive:0x00ffcc, emissiveIntensity:1.0,
    transparent:true, opacity:0.75, roughness:1.0, metalness:0.0
  });

  const TOP = 0.55, BOT = -0.35, NTY = 0.15, NBY = -0.05;
  const tv = new Float32Array([
    0,NTY,-5.5, -5.5,TOP,3.5,  5.5,TOP,3.5,
    0,NBY,-5.5,  5.5,BOT,3.5, -5.5,BOT,3.5,
    0,NTY,-5.5,  0,NBY,-5.5, -5.5,TOP,3.5,
    0,NBY,-5.5, -5.5,BOT,3.5, -5.5,TOP,3.5,
    0,NTY,-5.5,  5.5,TOP,3.5,  0,NBY,-5.5,
    0,NBY,-5.5,  5.5,TOP,3.5,  5.5,BOT,3.5,
    -5.5,TOP,3.5, -5.5,BOT,3.5, 5.5,BOT,3.5,
    -5.5,TOP,3.5,  5.5,BOT,3.5, 5.5,TOP,3.5
  ]);
  const dGeo = new THREE.BufferGeometry();
  dGeo.setAttribute('position', new THREE.BufferAttribute(tv, 3));
  dGeo.computeVertexNormals();
  bankGroup.add(new THREE.Mesh(dGeo, matBody));

  const spineGeo = new THREE.BoxGeometry(2.2, 1.4, 6.0, 4, 1, 1);
  const spVerts = spineGeo.attributes.position;
  for (let i = 0; i < spVerts.count; i++) {
    const z = spVerts.getZ(i);
    if (z < -2.5) {
      const x = spVerts.getX(i);
      const y = spVerts.getY(i);
      const cornerDist = Math.sqrt(x*x + y*y);
      const maxR = 0.9;
      if (cornerDist > maxR) {
        const sc = maxR / cornerDist;
        spVerts.setX(i, x * sc);
        spVerts.setY(i, y * sc);
      }
      const taper = 1 - ((-2.5 - z) / 0.5) * 0.3;
      spVerts.setX(i, spVerts.getX(i) * taper);
      spVerts.setY(i, spVerts.getY(i) * taper);
    }
  }
  spVerts.needsUpdate = true;
  spineGeo.computeVertexNormals();
  const spine = new THREE.Mesh(spineGeo, matUnder);
  spine.position.set(0, 0.3, -0.5);
  bankGroup.add(spine);

  const cockpit = new THREE.Mesh(new THREE.SphereGeometry(0.65, 10, 7), matCockpit);
  cockpit.scale.set(0.9, 0.55, 1.6);
  cockpit.position.set(0, 0.62, -1.8);
  bankGroup.add(cockpit);

  const thrusterGeo = new THREE.CylinderGeometry(1.75, 2.0, 3.0, 12);
  thrusterGeo.rotateX(Math.PI / 2);
  const matThruster = new THREE.MeshStandardMaterial({color:0x888888, emissive:0x333333, emissiveIntensity:0.2, metalness:0.7, roughness:0.3, flatShading:true});
  const thruster = new THREE.Mesh(thrusterGeo, matThruster);
  thruster.position.set(0, -0.1, 2.8);
  bankGroup.add(thruster);

  const flameGeoInner = new THREE.ConeGeometry(1.4, 12.0, 10);
  flameGeoInner.rotateX(Math.PI / 2);
  flameGeoInner.translate(0, 0, 6.0);
  const flameGeoOuter = new THREE.ConeGeometry(2.0, 14.0, 10);
  flameGeoOuter.rotateX(Math.PI / 2);
  flameGeoOuter.translate(0, 0, 7.0);
  const matFlameInner = new THREE.MeshBasicMaterial({color:0xffcc66, transparent:true, opacity:0.9});
  const matFlameOuter = new THREE.MeshBasicMaterial({color:0xff6600, transparent:true, opacity:0.5});
  const flameInner = new THREE.Mesh(flameGeoInner, matFlameInner);
  const flameOuter = new THREE.Mesh(flameGeoOuter, matFlameOuter);
  flameInner.position.set(0, -0.1, 1.0);
  flameOuter.position.set(0, -0.1, 0.3);
  bankGroup.add(flameOuter);
  bankGroup.add(flameInner);

  const weaponGroup = new THREE.Group();
  bankGroup.add(weaponGroup);
  const shieldGroup = new THREE.Group();
  bankGroup.add(shieldGroup);

  function clearGroup(g){
    while (g.children.length) {
      const c = g.children.pop();
      if (c.geometry) c.geometry.dispose();
      if (c.material) {
        if (Array.isArray(c.material)) c.material.forEach(m => m.dispose());
        else c.material.dispose();
      }
    }
  }

  function buildWeapon(idx){
    clearGroup(weaponGroup);
    if (idx === 0) return;
    if (idx === 1) {
      const g = new THREE.CylinderGeometry(0.18, 0.22, 3.0, 8);
      g.rotateX(Math.PI / 2);
      const m = new THREE.MeshStandardMaterial({color:0xff8833, emissive:0xff6600, emissiveIntensity:0.6, metalness:0.5, roughness:0.4});
      const b = new THREE.Mesh(g, m);
      b.position.set(0, -0.4, -2.5);
      weaponGroup.add(b);
      const tipG = new THREE.SphereGeometry(0.22, 8, 6);
      const tipM = new THREE.MeshBasicMaterial({color:0xffaa44});
      const tip = new THREE.Mesh(tipG, tipM);
      tip.position.set(0, -0.4, -4.0);
      weaponGroup.add(tip);
    } else if (idx === 2) {
      const g = new THREE.CylinderGeometry(0.18, 0.22, 3.2, 8);
      g.rotateX(Math.PI / 2);
      const m = new THREE.MeshStandardMaterial({color:0xff8833, emissive:0xff6600, emissiveIntensity:0.6, metalness:0.5, roughness:0.4});
      const tipM = new THREE.MeshBasicMaterial({color:0xffaa44});
      [-2.6, 2.6].forEach(x => {
        const b = new THREE.Mesh(g, m);
        b.position.set(x, -0.3, -1.6);
        weaponGroup.add(b);
        const tip = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 6), tipM);
        tip.position.set(x, -0.3, -3.2);
        weaponGroup.add(tip);
      });
    } else if (idx === 3) {
      const g = new THREE.CylinderGeometry(0.10, 0.10, 1.6, 8);
      g.rotateX(Math.PI / 2);
      const m = new THREE.MeshStandardMaterial({color:0xff44ff, emissive:0xff00ff, emissiveIntensity:1.4, metalness:0.7, roughness:0.2});
      const tipM = new THREE.MeshBasicMaterial({color:0xff66ff});
      [-5.2, 5.2].forEach(x => {
        const b = new THREE.Mesh(g, m);
        b.position.set(x, 0.2, 2.0);
        weaponGroup.add(b);
        const tip = new THREE.Mesh(new THREE.SphereGeometry(0.30, 8, 6), tipM);
        tip.position.set(x, 0.2, 1.0);
        weaponGroup.add(tip);
      });
    } else if (idx === 4) {
      const g = new THREE.CylinderGeometry(0.55, 0.7, 2.4, 12);
      g.rotateX(Math.PI / 2);
      const m = new THREE.MeshStandardMaterial({color:0x222244, emissive:0x00ccff, emissiveIntensity:0.8, metalness:0.8, roughness:0.3});
      const b = new THREE.Mesh(g, m);
      b.position.set(0, -0.45, -2.6);
      weaponGroup.add(b);
      const ringG = new THREE.TorusGeometry(0.85, 0.10, 8, 24);
      const ringM = new THREE.MeshBasicMaterial({color:0x00ffff, transparent:true, opacity:0.85});
      const ring = new THREE.Mesh(ringG, ringM);
      ring.position.set(0, -0.45, -3.7);
      weaponGroup.add(ring);
      const coreG = new THREE.SphereGeometry(0.42, 12, 10);
      const coreM = new THREE.MeshBasicMaterial({color:0x66ffff, transparent:true, opacity:0.9});
      const core = new THREE.Mesh(coreG, coreM);
      core.position.set(0, -0.45, -3.7);
      weaponGroup.add(core);
    }
  }

  function buildShield(idx){
    clearGroup(shieldGroup);
    if (idx === 0) return;
    const s = SHIELD_STYLES[idx];
    let geo;
    if (s.geo === 'icosa') geo = new THREE.IcosahedronGeometry(7.5, 1);
    else geo = new THREE.SphereGeometry(7.5, 24, 18);
    const mat = new THREE.MeshBasicMaterial({
      color: s.color,
      transparent: true,
      opacity: s.opacity,
      wireframe: (s.geo === 'icosa'),
      side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.scale.setScalar(s.scale);
    shieldGroup.add(mesh);
    if (idx === 5) {
      const inner = new THREE.Mesh(new THREE.SphereGeometry(7.5, 24, 18), new THREE.MeshBasicMaterial({color:0xff66cc, transparent:true, opacity:0.18, side:THREE.DoubleSide}));
      inner.scale.setScalar(s.scale * 0.97);
      shieldGroup.add(inner);
    }
  }

  let currentSpeedTier = 1;
  function applySpeed(idx){
    currentSpeedTier = idx;
    const p = FLAME_PALETTES[idx];
    flameInner.material.color.setHex(p.inner);
    flameOuter.material.color.setHex(p.outer);
  }

  function updateStats(){
    const w = parseInt(document.getElementById('selWeapon').value);
    const sh = parseInt(document.getElementById('selShield').value);
    const sp = parseInt(document.getElementById('selSpeed').value);
    document.getElementById('vWeapon').textContent = WEAPON_NAMES[w];
    document.getElementById('vShield').textContent = SHIELD_NAMES[sh];
    document.getElementById('vSpeed').textContent = SPEED_NAMES[sp];
    const weight = WEAPON_WEIGHTS[w] + SHIELD_WEIGHTS[sh];
    let cls = 'LIGHT', clsCol = 'weight-light';
    if (weight >= 10) { cls = 'HEAVY'; clsCol = 'weight-heavy'; }
    else if (weight >= 5) { cls = 'MEDIUM'; clsCol = 'weight-medium'; }
    const wEl = document.getElementById('vWeight');
    wEl.textContent = weight + ' / 15 (' + cls + ')';
    wEl.className = 'v ' + clsCol;
    const mult = SPEED_MULT[sp];
    const eff = BASE_SPEED * mult * (1 - weight * 0.02);
    document.getElementById('vEffSpeed').textContent = eff.toFixed(2);
    document.getElementById('formula').textContent = 'base ' + BASE_SPEED + ' x mult ' + mult.toFixed(2) + ' x (1 - ' + weight + ' x 0.02) = ' + eff.toFixed(2);
    buildWeapon(w);
    buildShield(sh);
    applySpeed(sp);
  }

  document.getElementById('selWeapon').addEventListener('change', updateStats);
  document.getElementById('selShield').addEventListener('change', updateStats);
  document.getElementById('selSpeed').addEventListener('change', updateStats);

  shipGroup.rotation.x = 0.15;
  shipGroup.scale.setScalar(0.9);

  let last = performance.now();
  const ROT_SPEED = (10 * Math.PI / 180);
  function animate(now){
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    turntable.rotation.y += ROT_SPEED * dt;
    const p = FLAME_PALETTES[currentSpeedTier];
    let fx = p.scale;
    if (p.pulse) fx *= (1 + Math.sin(now * 0.012) * 0.18);
    else fx *= (1 + Math.sin(now * 0.008) * 0.06);
    flameInner.scale.set(fx, fx, fx * 0.6);
    flameOuter.scale.set(fx * 1.3, fx * 1.3, fx * 0.63);
    const sk = shieldGroup.children[0];
    if (sk) {
      sk.rotation.y += dt * 0.3;
      sk.rotation.x += dt * 0.15;
    }
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  window.addEventListener('resize', resize);
  resize();
  updateStats();
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
