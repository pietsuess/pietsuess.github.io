<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captain Skyhawk</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  #fallback {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    color: #ffe000; font-family: 'Courier New', monospace; text-align: center; padding: 24px;
  }
  #fallback a { color: #66ddff; }
</style>
</head>
<body>
<iframe id="frame" src="https://www.retrogames.cz/play_1195-NES.php" allow="fullscreen; gamepad" allowfullscreen></iframe>
<div id="fallback">
  <div>
    <div style="font-size:18px;letter-spacing:3px;margin-bottom:18px;">CAPTAIN SKYHAWK</div>
    <div style="font-size:12px;letter-spacing:2px;opacity:0.8;line-height:1.6;">
      Embed blocked by host. Open directly:<br><br>
      <a href="https://www.retrogames.cz/play_1195-NES.php" target="_blank">retrogames.cz/play_1195-NES.php</a>
    </div>
  </div>
</div>
<script>
  // If the iframe fails to load (X-Frame-Options block), show the fallback link.
  var f = document.getElementById('frame');
  var fb = document.getElementById('fallback');
  var loaded = false;
  f.addEventListener('load', function(){ loaded = true; });
  setTimeout(function(){
    if (!loaded) { f.style.display = 'none'; fb.style.display = 'flex'; }
  }, 4000);
</script>
</body>
</html>
