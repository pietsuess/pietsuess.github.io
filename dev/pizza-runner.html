<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pizza Runner — Made With Love</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --red:#ED3E24;
    --red-deep:#8B1A12;
    --cream:#F2E6CC;
    --cream-light:#FAF6EE;
    --ink:#1A1A1A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--cream);overflow:hidden;
       font-family:'Inter','Helvetica Neue',Arial,sans-serif;
       touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink)}
  canvas{display:block;position:fixed;top:0;left:0}

  /* HUD — cream pills with red ink */
  #hud{position:fixed;top:14px;left:14px;right:14px;z-index:10;pointer-events:none;
       display:flex;justify-content:space-between;align-items:center;gap:12px}
  .pill{font-family:'Big Shoulders Display',sans-serif;font-weight:800;
        font-size:18px;letter-spacing:2px;color:var(--red);
        background:var(--cream-light);border:2px solid var(--red);
        padding:6px 14px;text-transform:uppercase;
        box-shadow:0 2px 0 var(--red-deep)}
  #lives .heart{color:var(--red);margin-right:2px}
  #lives .heart.dim{color:rgba(237,62,36,.18)}

  /* Progress bar — bottom ribbon */
  #progress-wrap{position:fixed;left:16px;right:16px;bottom:18px;z-index:10;pointer-events:none;
                 display:flex;flex-direction:column;align-items:center;gap:6px}
  #progress-label{font-family:'Big Shoulders Display',sans-serif;font-weight:800;
                  font-size:11px;letter-spacing:5px;color:var(--cream-light);
                  text-shadow:0 2px 0 var(--red-deep),0 0 14px rgba(0,0,0,.55)}
  #progress-bar{width:100%;max-width:560px;height:10px;
                background:var(--cream-light);border:2px solid var(--ink);
                box-shadow:0 2px 0 var(--ink)}
  #progress-fill{height:100%;width:0%;background:var(--red);
                 transition:width .15s linear}

  /* Overlays — cream paper screens with a red banner */
  .overlay{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;
           align-items:center;justify-content:center;text-align:center;padding:22px;
           background:var(--cream)}
  .overlay.show{display:flex}
  .overlay::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      repeating-linear-gradient(45deg, transparent 0 22px, rgba(237,62,36,.04) 22px 24px),
      radial-gradient(circle at 50% 30%, transparent 60%, rgba(139,26,18,.08) 100%);
  }

  .banner{position:relative;display:inline-block;
          background:var(--red);color:var(--cream-light);
          padding:8px 38px 10px;
          font-family:'Big Shoulders Display',sans-serif;font-weight:800;
          font-size:clamp(11px,2.5vw,14px);letter-spacing:6px;text-transform:uppercase;
          margin-bottom:14px;
          box-shadow:0 4px 0 var(--red-deep)}
  .banner::before,.banner::after{
    content:"";position:absolute;top:50%;width:14px;height:2px;background:var(--red-deep);
    transform:translateY(-50%);
  }
  .banner::before{left:-14px}
  .banner::after{right:-14px}

  .title{font-family:'Alfa Slab One',serif;
         font-size:clamp(48px,12vw,96px);
         color:var(--red);letter-spacing:1px;line-height:.9;
         text-transform:uppercase;
         text-shadow:3px 3px 0 var(--ink);
         margin:0 0 4px}
  .title .heart{display:inline-block;color:var(--red);
                animation:beat 1s ease-in-out infinite;
                margin:0 .15em;font-size:.78em;vertical-align:.1em}
  @keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.18)}60%{transform:scale(.95)}}

  .sub{font-family:'Big Shoulders Display',sans-serif;font-weight:600;
       font-size:clamp(13px,2.6vw,18px);letter-spacing:5px;color:var(--ink);
       text-transform:uppercase;margin-bottom:28px}

  .instr{display:inline-block;text-align:left;
         font-family:'Big Shoulders Display',sans-serif;font-weight:600;
         font-size:14px;letter-spacing:2px;color:var(--ink);line-height:2;
         margin-bottom:28px;text-transform:uppercase;
         border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);
         padding:14px 26px;max-width:400px}
  .instr .k{display:inline-block;color:var(--red);font-weight:800;min-width:88px}
  .instr .pts{color:var(--red-deep);font-weight:800}

  .btn{font-family:'Alfa Slab One',serif;font-size:18px;letter-spacing:3px;
       padding:14px 36px;cursor:pointer;text-transform:uppercase;
       background:var(--red);color:var(--cream-light);
       border:2px solid var(--ink);
       box-shadow:0 4px 0 var(--ink);
       -webkit-tap-highlight-color:transparent;
       transition:transform .08s, box-shadow .08s}
  .btn:hover{background:var(--red-deep)}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

  /* In-game flash + bursts */
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;
         z-index:40;transition:opacity .12s}
  .burst{position:fixed;font-family:'Alfa Slab One',serif;font-size:28px;
         pointer-events:none;z-index:60;letter-spacing:2px;
         text-shadow:2px 2px 0 var(--ink);
         animation:floatUp 1s ease-out forwards}
  @keyframes floatUp{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
                     20%{transform:translate(-50%,-50%) scale(1.25);opacity:1}
                     100%{transform:translate(-50%,calc(-50% - 120px)) scale(1);opacity:0}}

  #win-score{font-family:'Alfa Slab One',serif;font-size:32px;color:var(--red);
             letter-spacing:2px;margin-bottom:28px;
             text-shadow:2px 2px 0 var(--ink)}

  /* Decorative corner hearts on overlay */
  .corner-heart{position:absolute;font-size:28px;color:var(--red);
                opacity:.55;font-family:Arial,sans-serif}
  .corner-heart.tl{top:18px;left:22px}
  .corner-heart.tr{top:18px;right:22px}
  .corner-heart.bl{bottom:18px;left:22px}
  .corner-heart.br{bottom:18px;right:22px}
</style>
</head>
<body>

<div id="hud">
  <div id="score" class="pill">000000</div>
  <div id="lives" class="pill"><span class="heart">♥</span><span class="heart">♥</span><span class="heart">♥</span></div>
</div>

<div id="progress-wrap">
  <div id="progress-label">To The Oven</div>
  <div id="progress-bar"><div id="progress-fill"></div></div>
</div>

<div id="flash"></div>

<div id="start-screen" class="overlay show">
  <span class="corner-heart tl">♥</span><span class="corner-heart tr">♥</span>
  <span class="corner-heart bl">♥</span><span class="corner-heart br">♥</span>
  <div class="banner">Made With Love</div>
  <h1 class="title">Pizza<span class="heart">♥</span>Runner</h1>
  <div class="sub">One Slice. One Oven. One Run.</div>
  <div class="instr">
    <div><span class="k">Steer</span> Drag / Arrow Keys</div>
    <div><span class="k">Grab</span> Toppings <span class="pts">+50</span></div>
    <div><span class="k">Dodge</span> Fallen Bricks</div>
    <div><span class="k">Finish</span> Fly Into The Oven</div>
  </div>
  <button class="btn" id="start-btn">Start Delivery</button>
</div>

<div id="win-screen" class="overlay">
  <span class="corner-heart tl">♥</span><span class="corner-heart tr">♥</span>
  <span class="corner-heart bl">♥</span><span class="corner-heart br">♥</span>
  <div class="banner">Hot &amp; Ready</div>
  <h1 class="title">Delivered<span class="heart">♥</span></h1>
  <div class="sub">Made With Love</div>
  <div id="win-score">000000</div>
  <button class="btn" id="win-btn">Run It Again</button>
</div>

<div id="lose-screen" class="overlay">
  <span class="corner-heart tl">♥</span><span class="corner-heart tr">♥</span>
  <span class="corner-heart bl">♥</span><span class="corner-heart br">♥</span>
  <div class="banner">House Special</div>
  <h1 class="title">Dough<br>Dropped</h1>
  <div class="sub">Too Many Bricks</div>
  <button class="btn" id="lose-btn">Try Again</button>
</div>

<script>
(function(){
  const TUBE_RADIUS = 18;
  const SEGMENT_LEN = 30;
  const NUM_SEGMENTS = 18;
  const SPAWN_AHEAD = -240;
  const PLAYER_Z = 0;
  const SPEED = 70;             // units per second
  const LEVEL_DISTANCE = 2400;  // total distance to oven
  const STEER_RADIUS = 12;      // how far player can move from center

  // --- Three.js setup ---
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x1a0a04, 60, 260);
  const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 600);
  camera.position.set(0, 0, 12);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x0a0604);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffaa66, 0.55));
  const torchLight = new THREE.PointLight(0xff8a3d, 1.6, 120);
  torchLight.position.set(0, 0, 5);
  scene.add(torchLight);

  // --- Brick tunnel (procedural texture) ---
  const brickTex = (function(){
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = '#3a1a0e'; g.fillRect(0,0,256,256);
    const rows = 8, cols = 6;
    const rh = 256/rows, cw = 256/cols;
    for(let r=0;r<rows;r++){
      const offset = (r%2)*cw/2;
      for(let col=-1;col<cols+1;col++){
        const x = col*cw + offset;
        const y = r*rh;
        const tone = 60 + Math.floor(Math.random()*50);
        g.fillStyle = `rgb(${tone+30},${Math.floor(tone*0.45)},${Math.floor(tone*0.25)})`;
        g.fillRect(x+2, y+2, cw-4, rh-4);
        g.strokeStyle = '#1a0805'; g.lineWidth = 2;
        g.strokeRect(x+2, y+2, cw-4, rh-4);
      }
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(4, 1);
    return t;
  })();

  const tunnelGeo = new THREE.CylinderGeometry(TUBE_RADIUS, TUBE_RADIUS, SEGMENT_LEN, 24, 1, true);
  tunnelGeo.rotateX(Math.PI/2);
  const tunnelMat = new THREE.MeshStandardMaterial({
    map: brickTex, side: THREE.BackSide, roughness: .9, metalness: .05
  });

  const segments = [];
  for(let i=0;i<NUM_SEGMENTS;i++){
    const seg = new THREE.Mesh(tunnelGeo, tunnelMat);
    seg.position.z = -i * SEGMENT_LEN;
    scene.add(seg);
    segments.push(seg);
  }

  // --- Player: a pizza slice (delta-wing alignment) ---
  // Tip points forward into the tunnel (-Z); crust at the back, toward camera (+Z).
  const player = new THREE.Group();

  // Triangle in XY plane: base at y=0 (back), tip at y=3.4 (front).
  // After rotateX(-π/2), the +Y axis maps to -Z, so the tip lands forward.
  const sliceShape = new THREE.Shape();
  sliceShape.moveTo(-2.6, 0);    // back-left corner
  sliceShape.lineTo(0, 3.4);     // tip (will become forward)
  sliceShape.lineTo(2.6, 0);     // back-right corner
  sliceShape.lineTo(-2.6, 0);
  const sliceGeo = new THREE.ExtrudeGeometry(sliceShape, {depth: .35, bevelEnabled: false});
  sliceGeo.rotateX(-Math.PI/2);  // lay flat; +Y -> -Z (tip forward)
  // After rotation: tip at z=-3.4, crust edge at z=0; thickness in +Y (slice top = y=0.35)
  // Center it slightly so the camera sees the whole slice:
  sliceGeo.translate(0, 0, 1.5); // tip at z=-1.9, back edge at z=+1.5
  const sliceMat = new THREE.MeshStandardMaterial({color: 0xffd07a, roughness: .8});
  const slice = new THREE.Mesh(sliceGeo, sliceMat);
  player.add(slice);

  // Crust along the back edge (toward camera)
  const crustGeo = new THREE.BoxGeometry(5.4, .55, .85);
  const crustMat = new THREE.MeshStandardMaterial({color: 0x9c6325, roughness: .9});
  const crust = new THREE.Mesh(crustGeo, crustMat);
  crust.position.set(0, 0.45, 1.5); // sits on top of the back edge
  player.add(crust);

  // Pepperoni dots on the slice top (y > slice top), spread along the slice
  const pepGeo = new THREE.CylinderGeometry(.45, .45, .14, 14);
  const pepMat = new THREE.MeshStandardMaterial({color: 0xc8261a, roughness: .6});
  [[0, 0.6], [0.9, -0.5], [-0.9, -0.3], [0, -1.4]].forEach(([x, z])=>{
    const p = new THREE.Mesh(pepGeo, pepMat);
    p.position.set(x, 0.42, z); // y just above slice top (0.35)
    player.add(p);
  });

  player.position.set(0, 0, PLAYER_Z);
  player.rotation.x = -0.05; // very slight nose-up at rest
  scene.add(player);

  // --- Pizza toppings: shapes that actually look like the real thing ---

  // 1) Pepperoni — flat red-orange disc
  const pepperoniGeo = new THREE.CylinderGeometry(1.15, 1.15, .22, 20);
  pepperoniGeo.rotateX(Math.PI/2); // flat face points along Z toward camera
  const pepperoniMat = new THREE.MeshStandardMaterial({
    color: 0xd9341c, roughness: .55, emissive: 0x4a0905, emissiveIntensity: .35
  });

  // 2) Green bell pepper — curved C-shaped strip (cross-section of a pepper ring)
  const peppShape = new THREE.Shape();
  const pOut = 1.15, pIn = .78;
  const pA0 = -Math.PI * 0.55, pA1 = Math.PI * 0.55;
  peppShape.absarc(0, 0, pOut, pA0, pA1, false);
  peppShape.absarc(0, 0, pIn, pA1, pA0, true);
  const pepperGeo = new THREE.ExtrudeGeometry(peppShape, {depth: .18, bevelEnabled: false});
  pepperGeo.translate(0, 0, -.09);
  const pepperMat = new THREE.MeshStandardMaterial({
    color: 0x4ea535, roughness: .6, emissive: 0x0d2a0a, emissiveIntensity: .3
  });

  // 3) Mushroom slice — cross-section: rounded cap on top + stem below (flat extrusion)
  const mushShape = new THREE.Shape();
  mushShape.moveTo(-.95, 0);
  mushShape.bezierCurveTo(-.95, 1.0, .95, 1.0, .95, 0); // cap dome
  mushShape.lineTo(.38, 0);
  mushShape.lineTo(.38, -.78);                          // stem right
  mushShape.lineTo(-.38, -.78);                         // stem bottom
  mushShape.lineTo(-.38, 0);
  mushShape.lineTo(-.95, 0);
  const mushroomGeo = new THREE.ExtrudeGeometry(mushShape, {depth: .16, bevelEnabled: false});
  mushroomGeo.translate(0, .05, -.08);
  const mushroomMat = new THREE.MeshStandardMaterial({
    color: 0xead2a2, roughness: .75, emissive: 0x3a2814, emissiveIntensity: .25
  });

  // 4) Black olive — flat ring with a hole (sliced cross-section)
  const oliveGeo = new THREE.TorusGeometry(.85, .26, 10, 22);
  const oliveMat = new THREE.MeshStandardMaterial({
    color: 0x140a10, roughness: .65, emissive: 0x080406, emissiveIntensity: .25
  });

  const toppingDefs = [
    { geo: pepperoniGeo, mat: pepperoniMat, name: 'pepperoni' },
    { geo: pepperGeo,    mat: pepperMat,    name: 'pepper'    },
    { geo: mushroomGeo,  mat: mushroomMat,  name: 'mushroom'  },
    { geo: oliveGeo,     mat: oliveMat,     name: 'olive'     },
  ];

  const brickGeo = new THREE.BoxGeometry(3, 1.6, 1.6);
  const brickMat = new THREE.MeshStandardMaterial({
    map: brickTex, color: 0xb05030, roughness: .85
  });

  const items = [];

  function spawnItem(z){
    const isBrick = Math.random() < 0.42;
    let mesh, type, hitR;
    const angle = Math.random() * Math.PI * 2;
    const r = (Math.random() * 0.55 + 0.15) * STEER_RADIUS;
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;
    if(isBrick){
      mesh = new THREE.Mesh(brickGeo, brickMat);
      mesh.rotation.set(Math.random()*0.6, Math.random()*0.6, Math.random()*0.6);
      type = 'brick'; hitR = 1.7;
    } else {
      const def = toppingDefs[Math.floor(Math.random() * toppingDefs.length)];
      mesh = new THREE.Mesh(def.geo, def.mat);
      // Toppings should mostly face the camera so their silhouette reads.
      // Spin slowly around Y so they wobble but stay legible.
      mesh.userData.spinY = (Math.random()-.5) * 1.2;
      mesh.userData.spinZ = 0;
      type = 'topping'; hitR = 1.5;
    }
    mesh.position.set(x, y, z);
    mesh.userData.type = type;
    mesh.userData.hitR = hitR;
    scene.add(mesh);
    items.push(mesh);
  }

  // --- Oven (level end) ---
  // Always visible from the start so the player sees light at the end of the tunnel.
  // Glow materials use fog:false so they shine through the fog regardless of distance.
  const oven = new THREE.Group();

  // Mouth: bright glowing disc — pierces fog so it reads from far away
  const mouthGeo = new THREE.CircleGeometry(TUBE_RADIUS - 1, 36);
  const mouthMat = new THREE.MeshBasicMaterial({color: 0xffb44a, fog: false});
  const mouth = new THREE.Mesh(mouthGeo, mouthMat);
  oven.add(mouth);

  // Inner glow ring (deeper red/orange, also fog-immune)
  const ringGeo = new THREE.RingGeometry(TUBE_RADIUS - 5, TUBE_RADIUS - 1, 36);
  const ringMat = new THREE.MeshBasicMaterial({color: 0xff5a1a, side: THREE.DoubleSide, fog: false});
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.z = 0.05;
  oven.add(ring);

  // Outer brick frame — fogs normally so it only resolves once close
  const frameGeo = new THREE.RingGeometry(TUBE_RADIUS - 1, TUBE_RADIUS + 1.5, 36);
  const frameMat = new THREE.MeshStandardMaterial({map: brickTex, color: 0x8a4020, side: THREE.DoubleSide});
  const frame = new THREE.Mesh(frameGeo, frameMat);
  frame.position.z = 0.1;
  oven.add(frame);

  // Spotlight cast from the oven back toward the player so walls catch warm light
  const ovenLight = new THREE.PointLight(0xff7a1a, 1.6, 800, 1.6);
  ovenLight.position.set(0, 0, 4); // sits just in front of the mouth
  oven.add(ovenLight);

  oven.visible = true;
  scene.add(oven);

  // --- Game state ---
  const state = {
    running: false,
    score: 0,
    lives: 3,
    distance: 0,
    invuln: 0,
    targetX: 0,
    targetY: 0,
    finishing: false,
    finishT: 0,
  };

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(6, '0');
  const drawHud = () => {
    $('score').textContent = pad(state.score);
    const lives = Math.max(0, Math.min(3, state.lives));
    $('lives').innerHTML =
      Array.from({length:3}, (_,i) =>
        `<span class="heart${i < lives ? '' : ' dim'}">♥</span>`
      ).join('');
    $('progress-fill').style.width =
      Math.min(100, (state.distance / LEVEL_DISTANCE) * 100) + '%';
  };

  function reset(){
    state.score = 0; state.lives = 3; state.distance = 0;
    state.invuln = 0; state.targetX = 0; state.targetY = 0;
    state.finishing = false; state.finishT = 0;
    items.forEach(m => scene.remove(m));
    items.length = 0;
    player.position.set(0, 0, PLAYER_Z);
    // Oven sits at the far end of the level from the start so its glow is visible.
    oven.visible = true;
    oven.position.z = -LEVEL_DISTANCE;
    ovenLight.intensity = 1.6;
    drawHud();
  }

  function flash(color){
    const f = $('flash');
    f.style.background = color;
    f.style.opacity = '0.55';
    setTimeout(()=>f.style.opacity = '0', 120);
  }

  function burst(text, color, x, y){
    const el = document.createElement('div');
    el.className = 'burst';
    el.textContent = text;
    el.style.color = color;
    el.style.textShadow = '0 0 10px ' + color;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 1000);
  }

  // --- Audio (tiny) ---
  let audio;
  function beep(freq, dur, type){
    if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = 0.0001;
    g.gain.exponentialRampToValueAtTime(0.18, audio.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + dur);
  }

  // --- Input ---
  const input = {x:0, y:0, dragging:false, dragX:0, dragY:0};
  const keys = {};
  addEventListener('keydown', e=>{ keys[e.key]=true; });
  addEventListener('keyup',   e=>{ keys[e.key]=false; });

  function onPointerDown(e){
    input.dragging = true;
    const t = e.touches ? e.touches[0] : e;
    input.dragX = t.clientX; input.dragY = t.clientY;
  }
  function onPointerMove(e){
    if(!input.dragging) return;
    const t = e.touches ? e.touches[0] : e;
    const dx = (t.clientX - input.dragX) / innerWidth;
    const dy = (t.clientY - input.dragY) / innerHeight;
    state.targetX = Math.max(-1, Math.min(1, state.targetX + dx*2.5));
    state.targetY = Math.max(-1, Math.min(1, state.targetY - dy*2.5));
    input.dragX = t.clientX; input.dragY = t.clientY;
    e.preventDefault();
  }
  function onPointerUp(){ input.dragging = false; }
  addEventListener('mousedown', onPointerDown);
  addEventListener('mousemove', onPointerMove);
  addEventListener('mouseup',   onPointerUp);
  addEventListener('touchstart', onPointerDown, {passive:false});
  addEventListener('touchmove',  onPointerMove, {passive:false});
  addEventListener('touchend',   onPointerUp);

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // --- Buttons ---
  $('start-btn').addEventListener('click', ()=>{
    $('start-screen').classList.remove('show');
    reset();
    state.running = true;
    try { if(audio && audio.state === 'suspended') audio.resume(); } catch(e){}
    beep(440, .12, 'square');
    setTimeout(()=>beep(660, .14, 'square'), 110);
  });
  $('win-btn').addEventListener('click', ()=>{
    $('win-screen').classList.remove('show');
    reset();
    state.running = true;
  });
  $('lose-btn').addEventListener('click', ()=>{
    $('lose-screen').classList.remove('show');
    reset();
    state.running = true;
  });

  // --- Game loop ---
  let prev = performance.now();
  function loop(now){
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - prev) / 1000);
    prev = now;

    if(state.running){
      tick(dt);
    }
    renderer.render(scene, camera);
  }

  function tick(dt){
    // Keyboard steering
    let kx = 0, ky = 0;
    if(keys['ArrowLeft']  || keys['a']) kx -= 1;
    if(keys['ArrowRight'] || keys['d']) kx += 1;
    if(keys['ArrowUp']    || keys['w']) ky += 1;
    if(keys['ArrowDown']  || keys['s']) ky -= 1;
    state.targetX = Math.max(-1, Math.min(1, state.targetX + kx * dt * 2.0));
    state.targetY = Math.max(-1, Math.min(1, state.targetY + ky * dt * 2.0));

    // Smooth-follow player toward target
    const tx = state.targetX * STEER_RADIUS;
    const ty = state.targetY * STEER_RADIUS;
    player.position.x += (tx - player.position.x) * Math.min(1, dt * 8);
    player.position.y += (ty - player.position.y) * Math.min(1, dt * 8);
    player.rotation.z = -((tx - player.position.x) * 0.12 + state.targetX * 0.4);
    player.rotation.x = -0.05 - state.targetY * 0.25;

    // Camera follows lightly
    camera.position.x = player.position.x * 0.4;
    camera.position.y = player.position.y * 0.4;
    camera.lookAt(player.position.x*0.6, player.position.y*0.6, -30);

    torchLight.position.set(player.position.x, player.position.y, player.position.z + 4);
    torchLight.intensity = 1.4 + Math.sin(performance.now()*0.012) * 0.25;

    if(state.invuln > 0) state.invuln -= dt;
    slice.material.opacity = state.invuln > 0 ? (Math.sin(performance.now()*0.04) > 0 ? 0.4 : 1) : 1;
    slice.material.transparent = state.invuln > 0;

    // Move world toward player
    const dz = SPEED * dt;
    state.distance += dz;

    // Tunnel scroll
    for(const seg of segments){
      seg.position.z += dz;
      if(seg.position.z > SEGMENT_LEN){
        // recycle to back
        const minZ = Math.min(...segments.map(s=>s.position.z));
        seg.position.z = minZ - SEGMENT_LEN;
      }
    }

    // Spawn items ahead until oven is near
    if(!state.finishing){
      // farthest item Z currently
      let farthest = SPAWN_AHEAD;
      for(const it of items){ if(it.position.z < farthest) farthest = it.position.z; }
      // Stop spawning when we're close to the oven
      const remaining = LEVEL_DISTANCE - state.distance;
      while(farthest > SPAWN_AHEAD - 240 && remaining > 80){
        const z = farthest - (16 + Math.random() * 16);
        if(LEVEL_DISTANCE - (state.distance - z) < 60) break;
        spawnItem(z);
        farthest = z;
      }
    }

    // Update items
    for(let i = items.length - 1; i >= 0; i--){
      const it = items[i];
      it.position.z += dz;
      if(it.userData.type === 'topping'){
        it.rotation.y += it.userData.spinY * dt;
        it.rotation.z += it.userData.spinZ * dt;
      } else {
        it.rotation.x += dt * 0.6;
      }
      // Collision: separate, generous hitbox for toppings vs tighter for bricks.
      // Slice spans roughly z=-1.9 to z=+1.5, so the z windows reflect the slice length.
      const dz = it.position.z - player.position.z;
      const dx = it.position.x - player.position.x;
      const dy = it.position.y - player.position.y;
      const d  = Math.hypot(dx, dy);
      if(it.userData.type === 'topping'){
        // Generous: anywhere over the slice counts as a grab.
        if(Math.abs(dz) < 2.6 && d < it.userData.hitR + 2.6){
          state.score += 50;
          burst('+50', '#ED3E24', innerWidth/2, innerHeight/2);
          beep(880, .1, 'square');
          scene.remove(it); items.splice(i,1);
          continue;
        }
      } else {
        // Bricks: tighter so dodging matters.
        if(Math.abs(dz) < 1.8 && d < it.userData.hitR + 1.6){
          if(state.invuln <= 0){
            state.lives -= 1;
            state.invuln = 1.4;
            flash('#ED3E24');
            burst('OUCH', '#1A1A1A', innerWidth/2, innerHeight/2);
            beep(110, .25, 'sawtooth');
            scene.remove(it); items.splice(i,1);
            if(state.lives <= 0){
              state.running = false;
              $('lose-screen').classList.add('show');
              return;
            }
            continue;
          }
        }
      }
      // Cleanup behind player
      if(it.position.z > 30){
        scene.remove(it); items.splice(i,1);
      }
    }

    // Oven sits at the level end the entire run; just track its z and grow the
    // light intensity as the player closes in.
    const distLeft = LEVEL_DISTANCE - state.distance;
    oven.position.z = -distLeft;
    const closeness = Math.max(0, Math.min(1, 1 - distLeft / 600));
    ovenLight.intensity = 1.6 + closeness * 2.0;
    mouth.material.color.setHSL(0.07, 1, 0.5 + Math.sin(performance.now()*0.005)*0.08);
    ring.material.color.setHSL(0.04, 1, 0.45 + Math.sin(performance.now()*0.008)*0.1);

    drawHud();

    // Win
    if(distLeft <= 0 && !state.finishing){
      state.finishing = true;
      flash('#FAF6EE');
      beep(660, .12, 'square');
      setTimeout(()=>beep(880, .12, 'square'), 110);
      setTimeout(()=>beep(1320, .25, 'square'), 230);
      setTimeout(()=>{
        state.running = false;
        $('win-score').textContent = pad(state.score);
        $('win-screen').classList.add('show');
      }, 600);
    }
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
