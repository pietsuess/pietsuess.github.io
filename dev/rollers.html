<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ROLLERS</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  #game { display: block; width: 100vw; height: 100vh;
          image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; }
  #hud { display: none; }
  #zone {
    position: fixed; top: 14px; right: 16px; z-index: 6;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: 12px; letter-spacing: 2px;
    color: #ffe000; pointer-events: none;
    background: rgba(0,0,0,0.35); padding: 8px 12px; border-radius: 4px;
  }
  #gems {
    position: fixed; top: 50px; right: 16px; z-index: 6;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    font-size: 12px; letter-spacing: 2px;
    color: #ffe066; pointer-events: none;
    background: rgba(0,0,0,0.35); padding: 8px 12px; border-radius: 4px;
  }
  #hud-top { position: absolute; top: 8px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 14px; font-size: 12px; letter-spacing: 2px; }
  #hud-bottom { position: absolute; bottom: 14px; left: 14px; display: flex; gap: 12px; align-items: flex-end; }
  #radar {
    width: 96px; height: 96px; border: 2px solid #ffe000; border-radius: 50%;
    background: rgba(0, 32, 64, 0.65); box-shadow: 0 0 8px rgba(255,224,0,0.6) inset;
    position: relative; overflow: hidden;
  }
  .radar-blip { position: absolute; width: 4px; height: 4px; border-radius: 50%; transform: translate(-50%, -50%); }
  .blip-hill { background: #ff7733; box-shadow: 0 0 4px #ff7733; }
  .blip-hole { background: #66ccff; box-shadow: 0 0 4px #66ccff; }
  .blip-found { opacity: 0.4; }
  #radar-self { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; background: #ffe000; border-radius: 50%; z-index: 2; }
  #radar-cone { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none;
                border-left: 8px solid transparent; border-right: 8px solid transparent;
                border-bottom: 14px solid rgba(255,224,0,0.4);
                transform-origin: 50% 100%; transform: translate(-50%, -100%); }
  #stat-block { font-size: 10px; letter-spacing: 1px; line-height: 1.6; color: #66ddff; text-shadow: 0 0 4px rgba(102,221,255,0.6); }
  #hint { position: absolute; bottom: 14px; right: 14px; font-size: 8px; letter-spacing: 1px; color: #88aacc; text-align: right; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="zone">ZONE <span id="zone-val">0°,90°</span></div>
<div id="gems">GEMS <span id="gems-val">0/0</span></div>
<div id="hud">
  <div id="hud-top">
    <div>FOUND <span id="found">0</span>/<span id="total">0</span></div>
    <div>HDG <span id="hdg">N</span></div>
  </div>
  <div id="hud-bottom">
    <div id="radar">
      <div id="radar-cone"></div>
      <div id="radar-self"></div>
    </div>
    <div id="stat-block">
      X <span id="px">0</span><br>
      Z <span id="pz">0</span><br>
      SPD <span id="spd">0</span>
    </div>
  </div>
  <div id="hint">WASD / ARROWS<br>DRAG TO STEER</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(function(){
  // Render low-res for the chunky pixel feel, but match window aspect so
  // CSS upscaling doesn't stretch geometry. Width is fixed; height tracks aspect.
  const BASE_W = 360;

  const scene = new THREE.Scene();
  // Muted sky + warm haze so the whole world reads as soft clay rather than neon.
  scene.background = new THREE.Color(0xb8c8d4);
  scene.fog = new THREE.Fog(0xc8b8a0, 2500, 7000);

  const camera = new THREE.PerspectiveCamera(62, 1, 0.5, 4000);

  const canvas = document.getElementById('game');
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false });
  renderer.setPixelRatio(1);

  function fitRenderer() {
    const aspect = window.innerWidth / window.innerHeight;
    const w = BASE_W;
    const h = Math.max(160, Math.round(BASE_W / aspect));
    renderer.setSize(w, h, false);
    camera.aspect = aspect;
    camera.updateProjectionMatrix();
  }
  fitRenderer();
  window.addEventListener('resize', fitRenderer);

  // High diffuse ambient + soft warm sun gives the matte, low-contrast clay shading.
  scene.add(new THREE.AmbientLight(0xfff0d8, 0.75));
  const sun = new THREE.DirectionalLight(0xffe6c0, 0.55);
  sun.position.set(-300, 500, 200);
  scene.add(sun);

  // ── WORLD: large sphere — ball rolls on its surface, no edges ──
  const WORLD_R = 6000;

  // Fine-grained grass texture, tiled across the sphere. No grid — zone is
  // shown in a small HUD readout instead.
  const cnv = document.createElement('canvas');
  cnv.width = 128; cnv.height = 128;
  const cctx = cnv.getContext('2d');
  cctx.fillStyle = '#7e9258';
  cctx.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 1800; i++) {
    const x = Math.random() * 128, y = Math.random() * 128;
    const a = 0.05 + Math.random() * 0.12;
    cctx.fillStyle = Math.random() < 0.5
      ? 'rgba(60,72,40,' + a + ')'
      : 'rgba(180,196,140,' + a * 0.7 + ')';
    cctx.fillRect(x, y, 1 + Math.random() * 1.6, 1 + Math.random() * 1.6);
  }
  const groundTex = new THREE.CanvasTexture(cnv);
  groundTex.magFilter = THREE.LinearFilter;
  groundTex.minFilter = THREE.LinearMipMapLinearFilter;
  groundTex.generateMipmaps = true;
  groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
  groundTex.repeat.set(140, 70);
  const worldMat = new THREE.MeshLambertMaterial({ map: groundTex });

  // ── TERRAIN FEATURES: hills + craters scattered around the sphere ──
  // Each feature is a Gaussian bump at a direction (unit vector) on the sphere.
  function lmRand(seed) { return Math.abs(Math.sin(seed * 12.9898) * 43758.5453 % 1); }
  const features = [];
  const FEATURE_COUNT = 80;
  for (let i = 0; i < FEATURE_COUNT; i++) {
    const lon = lmRand(i + 31) * 2 * Math.PI;
    const lat = Math.acos(2 * lmRand(i + 53) - 1);
    const dir = new THREE.Vector3(
      Math.sin(lat) * Math.cos(lon),
      Math.cos(lat),
      Math.sin(lat) * Math.sin(lon)
    );
    // Angular radius (radians) — feature footprint on the sphere.
    const r = 0.035 + lmRand(i + 71) * 0.06;
    const isHole = lmRand(i + 89) < 0.45;
    const amp = isHole
      ? -(80 + lmRand(i + 103) * 140)
      :  (90 + lmRand(i + 117) * 160);
    features.push({ dir: dir, r: r, amp: amp });
  }

  function terrainOffset(dir) {
    let h = 0;
    for (let i = 0; i < features.length; i++) {
      const f = features[i];
      const dot = Math.max(-1, Math.min(1, dir.x * f.dir.x + dir.y * f.dir.y + dir.z * f.dir.z));
      const arc = Math.acos(dot);
      if (arc > f.r * 3) continue;
      h += f.amp * Math.exp(-(arc * arc) / (f.r * f.r));
    }
    return h;
  }

  // Build world geometry and displace vertices radially by the terrain offset.
  const worldGeo = new THREE.SphereGeometry(WORLD_R, 256, 160);
  {
    const pos = worldGeo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.set(pos.getX(i), pos.getY(i), pos.getZ(i));
      const len = v.length();
      const n = v.clone().divideScalar(len);
      const h = terrainOffset(n);
      v.copy(n).multiplyScalar(WORLD_R + h);
      pos.setX(i, v.x); pos.setY(i, v.y); pos.setZ(i, v.z);
    }
    worldGeo.computeVertexNormals();
  }
  const worldMesh = new THREE.Mesh(worldGeo, worldMat);
  scene.add(worldMesh);

  // ── COLLECTIBLES: glowing gems scattered across the surface ──
  const Y_AXIS = new THREE.Vector3(0, 1, 0);
  const _radial = new THREE.Vector3();
  const _qLM = new THREE.Quaternion();
  const collectibles = [];
  const COLLECT_TARGET = 70;
  for (let i = 0; i < COLLECT_TARGET; i++) {
    const lon = lmRand(i + 1.7) * 2 * Math.PI;
    const lat = Math.acos(2 * lmRand(i + 4.3) - 1);
    if (lat < 0.08) continue;            // skip a tiny cap right at the spawn pole
    _radial.set(
      Math.sin(lat) * Math.cos(lon),
      Math.cos(lat),
      Math.sin(lat) * Math.sin(lon)
    );
    const size = 14;
    const geo = new THREE.IcosahedronGeometry(size, 0);
    const col = new THREE.Color().setHSL(lmRand(i + 11.3), 0.9, 0.6);
    const mat = new THREE.MeshLambertMaterial({ color: col, emissive: col, emissiveIntensity: 0.45, flatShading: true });
    const gem = new THREE.Mesh(geo, mat);
    const surfaceR = WORLD_R + terrainOffset(_radial) + size + 4;
    gem.position.copy(_radial).multiplyScalar(surfaceR);
    _qLM.setFromUnitVectors(Y_AXIS, _radial);
    gem.quaternion.copy(_qLM);
    gem.userData.collected = false;
    gem.userData.size = size;
    scene.add(gem);
    collectibles.push(gem);
  }

  // ── SHIP: classic two-tone ball, light red on top hemisphere, blue on bottom ──
  // Hemispheres split by the sphere's object-space Y axis so colours stay
  // welded to the geometry and rotate with the rolling ball.
  const SHIP_R = 10;
  const ballMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  ballMat.onBeforeCompile = function(shader) {
    shader.vertexShader = shader.vertexShader.replace(
      '#include <common>',
      '#include <common>\nvarying vec3 vSurfN;'
    );
    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\nvSurfN = normalize(position);'
    );
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <common>',
      '#include <common>\nvarying vec3 vSurfN;'
    );
    shader.fragmentShader = shader.fragmentShader.replace(
      'vec4 diffuseColor = vec4( diffuse, opacity );',
      [
        'vec3 col;',
        'if (abs(vSurfN.y) < 0.025) {',
        '  col = vec3(0.10, 0.08, 0.08);',  // thin dark seam at equator
        '} else if (vSurfN.y > 0.0) {',
        '  col = vec3(0.92, 0.36, 0.36);',  // light red top
        '} else {',
        '  col = vec3(0.18, 0.42, 0.87);',  // blue bottom
        '}',
        'vec4 diffuseColor = vec4(col, opacity);'
      ].join('\n')
    );
  };
  const ball = new THREE.Mesh(new THREE.SphereGeometry(SHIP_R, 48, 32), ballMat);
  scene.add(ball);

  // Ship state — 3D position/velocity, constrained to the world sphere surface.
  //   ballPos        live 3D position; always at distance (WORLD_R + SHIP_R) from origin
  //   ballVel        tangent velocity vector (perpendicular to local up)
  //   ballForward    tangent unit vector — the player's "facing" direction on the surface
  const BALL_ALT = WORLD_R + SHIP_R;
  const ballPos = new THREE.Vector3(0, BALL_ALT, 0);   // spawn at the world's "north pole"
  const ballVel = new THREE.Vector3();
  const ballForward = new THREE.Vector3(0, 0, -1);     // initial facing direction

  const MAX_SPEED = 200;
  const ACCEL = 260;
  const REVERSE_ACCEL = 180;
  const TURN_RATE = 1.8;
  const FRICTION = 0.985;

  // Reusable scratch vectors / quaternion to avoid per-frame allocation.
  const _up = new THREE.Vector3();
  const _tmp = new THREE.Vector3();
  const _tmp2 = new THREE.Vector3();
  const _camTarget = new THREE.Vector3();
  const _lookAt = new THREE.Vector3();
  const _rollAxis = new THREE.Vector3();
  const _q = new THREE.Quaternion();

  // ── INPUT ──
  const keys = {};
  window.addEventListener('keydown', function(e) {
    keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].indexOf(e.code) >= 0) e.preventDefault();
  });
  window.addEventListener('keyup', function(e) { keys[e.code] = false; });

  // Touch / mouse drag as analog stick.
  let dragStart = null, dragNow = null;
  function getXY(e) {
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX, y: t.clientY };
  }
  function onStart(e) { dragStart = getXY(e); dragNow = dragStart; e.preventDefault(); }
  function onMove(e) { if (!dragStart) return; dragNow = getXY(e); e.preventDefault(); }
  function onEnd() { dragStart = null; dragNow = null; }
  canvas.addEventListener('touchstart', onStart, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  canvas.addEventListener('touchend', onEnd);
  canvas.addEventListener('mousedown', onStart);
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('mouseup', onEnd);
  canvas.addEventListener('mouseleave', onEnd);

  function readInput() {
    let throttle = 0, steer = 0;
    if (keys['KeyW'] || keys['ArrowUp']) throttle += 1;
    if (keys['KeyS'] || keys['ArrowDown']) throttle -= 1;
    if (keys['KeyA'] || keys['ArrowLeft']) steer -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) steer += 1;
    if (dragStart && dragNow) {
      const dx = dragNow.x - dragStart.x;
      const dy = dragNow.y - dragStart.y;
      const DEAD = 8;
      // Drag up beyond 80 px ramps up to a 3× boost (240 px = full boost).
      // Drag down is plain reverse, capped at -1.
      if (Math.abs(dy) > DEAD) {
        const raw = -dy / 80;
        throttle += Math.max(-1, Math.min(3, raw));
      }
      if (Math.abs(dx) > DEAD) steer += Math.max(-1, Math.min(1, dx / 80));
    }
    return {
      throttle: Math.max(-1, Math.min(3, throttle)),
      steer: Math.max(-1, Math.min(1, steer))
    };
  }

  // ── HUD: zone readout — lat/lon to the nearest 1° so it ticks while you roll. ──
  const zoneEl = document.getElementById('zone-val');
  function updateZone() {
    const dir = ballPos.clone().normalize();
    const lat = 90 - Math.acos(Math.max(-1, Math.min(1, dir.y))) * 180 / Math.PI;
    let lon = Math.atan2(dir.z, dir.x) * 180 / Math.PI;
    if (lon < 0) lon += 360;
    const lonR = Math.round(lon);
    const latR = Math.round(lat);
    zoneEl.textContent = lonR + '°,' + latR + '°';
  }

  // ── HUD: gem collection counter + per-frame collision check ──
  const gemsEl = document.getElementById('gems-val');
  gemsEl.textContent = '0/' + collectibles.length;
  let gemsCollected = 0;
  const COLLECT_DIST = 28;
  const COLLECT_DIST_SQ = COLLECT_DIST * COLLECT_DIST;
  function updateGems(dt) {
    for (let i = 0; i < collectibles.length; i++) {
      const g = collectibles[i];
      if (g.userData.collected) continue;
      // Spin uncollected gems for visibility.
      g.rotateY(dt * 1.6);
      const dx = g.position.x - ballPos.x;
      const dy = g.position.y - ballPos.y;
      const dz = g.position.z - ballPos.z;
      if (dx*dx + dy*dy + dz*dz < COLLECT_DIST_SQ) {
        g.userData.collected = true;
        g.visible = false;
        gemsCollected++;
        gemsEl.textContent = gemsCollected + '/' + collectibles.length;
      }
    }
  }

  // ── FRAME LOOP ──
  let lastT = performance.now();

  function frame() {
    const now = performance.now();
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    const inp = readInput();

    // Local frame at ball position: up = radial direction outward from world centre.
    _up.copy(ballPos).normalize();

    // Re-orthogonalize forward against current up (parallel transport keeps the
    // facing direction tangent to the sphere as the ball wanders around it).
    ballForward.addScaledVector(_up, -ballForward.dot(_up)).normalize();

    // Steering: rotate forward around the local up axis.
    if (inp.steer !== 0) ballForward.applyAxisAngle(_up, -inp.steer * TURN_RATE * dt);

    // Throttle: accelerate along forward.
    if (inp.throttle > 0) {
      ballVel.addScaledVector(ballForward, inp.throttle * ACCEL * dt);
    } else if (inp.throttle < 0) {
      ballVel.addScaledVector(ballForward, inp.throttle * REVERSE_ACCEL * dt);
    }

    // Gravity from terrain gradient — pulls ball downhill in the tangent plane.
    // Sample the terrain offset at ball position ± eps in forward and right directions
    // (rotating the radial direction around right/forward by a small angle).
    {
      const dir = _tmp.copy(ballPos).normalize();
      const right = _tmp2.crossVectors(ballForward, _up).normalize();
      const EPS = 0.004;
      const dF = dir.clone().applyAxisAngle(right, -EPS);
      const dB = dir.clone().applyAxisAngle(right,  EPS);
      const dR = dir.clone().applyAxisAngle(ballForward,  EPS);
      const dL = dir.clone().applyAxisAngle(ballForward, -EPS);
      const dhdf = (terrainOffset(dF) - terrainOffset(dB)) / (2 * EPS);
      const dhdr = (terrainOffset(dR) - terrainOffset(dL)) / (2 * EPS);
      // Tangent-plane gravity from the terrain gradient. Capped so the steepest
      // hills don't pin the ball — full throttle (and especially boost) can
      // always crawl uphill.
      const GRAVITY = 0.08;
      const MAX_GRAV_ACCEL = 180;
      let gf = -dhdf * GRAVITY;
      let gr = -dhdr * GRAVITY;
      const gMag = Math.sqrt(gf * gf + gr * gr);
      if (gMag > MAX_GRAV_ACCEL) {
        const s = MAX_GRAV_ACCEL / gMag;
        gf *= s; gr *= s;
      }
      ballVel.addScaledVector(ballForward, gf * dt);
      ballVel.addScaledVector(right,       gr * dt);
    }

    // Keep velocity tangent to the surface (remove any radial component).
    ballVel.addScaledVector(_up, -ballVel.dot(_up));

    // Friction.
    ballVel.multiplyScalar(Math.pow(FRICTION, dt * 60));

    // Cap speed. Boost: when throttle is between 1 and 3, the speed cap scales
    // with it, so dragging up past the normal-max threshold unlocks up to 3× MAX_SPEED.
    const targetMax = MAX_SPEED * Math.max(1, inp.throttle);
    const speed = ballVel.length();
    if (speed > targetMax) ballVel.multiplyScalar(targetMax / speed);

    // Move and re-project to the (bumpy) sphere surface — altitude follows
    // the local terrain offset so the ball rides over hills and into craters.
    ballPos.addScaledVector(ballVel, dt);
    const ballDir = _tmp.copy(ballPos).normalize();
    const surfH = WORLD_R + terrainOffset(ballDir) + SHIP_R;
    ballPos.copy(ballDir).multiplyScalar(surfH);

    // Recompute up after the move; re-tangent velocity + forward to the new tangent plane.
    _up.copy(ballPos).normalize();
    ballVel.addScaledVector(_up, -ballVel.dot(_up));
    ballForward.addScaledVector(_up, -ballForward.dot(_up)).normalize();

    // Position the ball mesh on the sphere.
    ball.position.copy(ballPos);

    // Roll the ball based on actual motion: axis = up × motion, angle = arc/R.
    const ds = ballVel.length() * dt;
    if (ds > 0.0001) {
      _tmp.copy(ballVel).normalize();          // motion direction
      _rollAxis.crossVectors(_up, _tmp).normalize();
      _q.setFromAxisAngle(_rollAxis, ds / SHIP_R);
      ball.quaternion.premultiply(_q);
    }

    // ── CHASE CAMERA: behind ball along -forward, above along +up. ──
    const CAM_BACK = 80;
    const CAM_UP = 75;
    _camTarget.copy(ballPos)
      .addScaledVector(ballForward, -CAM_BACK)
      .addScaledVector(_up, CAM_UP);
    camera.position.lerp(_camTarget, Math.min(1, dt * 6));
    camera.up.copy(_up);
    _lookAt.copy(ballPos)
      .addScaledVector(ballForward, 40)
      .addScaledVector(_up, 14);
    camera.lookAt(_lookAt);

    updateZone();
    updateGems(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  // Initial camera placement so the first frame isn't a snap.
  _up.copy(ballPos).normalize();
  camera.up.copy(_up);
  camera.position.copy(ballPos).addScaledVector(ballForward, -80).addScaledVector(_up, 75);
  _lookAt.copy(ballPos).addScaledVector(ballForward, 40).addScaledVector(_up, 14);
  camera.lookAt(_lookAt);

  frame();
})();
</script>
