<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halftone Scroll</title>
<style>
  html,body{margin:0;background:#F7EBD6;}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;z-index:0;}
  #rail{height:3000vh;}
  .grain,.soft{position:fixed;inset:0;z-index:1;pointer-events:none;}
  .grain{mix-blend-mode:multiply;opacity:.14;background-size:240px 240px;
    background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/>\
<feColorMatrix type='saturate' values='0'/></filter>\
<rect width='240' height='240' filter='url(%23n)' opacity='.55'/></svg>");}
  .soft{box-shadow:inset 0 0 180px rgba(90,55,35,.28), inset 0 0 60px rgba(90,55,35,.14);}
  #dial{position:fixed;left:20px;bottom:20px;z-index:3;display:flex;align-items:center;gap:14px;
        font:800 13px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;
        color:#4A362B;background:#FCE4B4;padding:12px 16px;border:3px solid #4A362B;
        box-shadow:6px 6px 0 #B04A38;}
  /* sized off the longest reading it can ever show, so the box never moves */
  #pitchVal{display:inline-block;width:4ch;text-align:left;font-variant-numeric:tabular-nums;
            background:#4A362B;color:#FCE4B4;padding:4px 6px;}
  #dial input{-webkit-appearance:none;appearance:none;width:200px;height:18px;
              background:#E4CC9C;border:3px solid #4A362B;margin:0;cursor:pointer;}
  #dial input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:30px;
              background:#24849C;border:3px solid #4A362B;box-shadow:3px 3px 0 #B04A38;}
  #dial input::-moz-range-thumb{width:18px;height:30px;border-radius:0;
              background:#24849C;border:3px solid #4A362B;box-shadow:3px 3px 0 #B04A38;}
  #dial input::-moz-range-track{background:#E4CC9C;height:12px;}


</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="rail"></div>
<div id="dial"><span>pitch</span><input id="pitch" type="range" min="2" max="24" step="0.5" value="5"><span id="pitchVal">05.0</span></div>
<div class="grain"></div>
<div class="soft"></div>

<script>
  history.scrollRestoration = "manual";
  scrollTo(0,0);
  addEventListener("load", () => scrollTo(0,0));
</script>

<script type="module">
import * as THREE from "three";

const PER_PIXEL = 0.9;    // world units travelled per pixel scrolled
const EASE      = 0.085;  // how softly the flight catches up to the scroll
const PITCH_CSS = 5.0;    // halftone pitch, in css pixels, fixed to the screen

const DPR = Math.min(devicePixelRatio, 2);

const renderer = new THREE.WebGLRenderer({ antialias:false });
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* ---------------- the flat art, in 3d ---------------- */

const scene  = new THREE.Scene();
// the grounds the sheet drifts through, all lifted off the card
const GROUNDS = ["#F1CBAB","#EBB19A","#F1DEB4","#CBA888"].map(h => new THREE.Color(h));
scene.background = new THREE.Color(GROUNDS[0]);

const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 1, 6000);
camera.position.z = 200;

// the shapes: the chevron from the still tile, plus plain geometry
const poly = (pts) => {
  const s = new THREE.Shape();
  pts.forEach(([x,y],i) => i ? s.lineTo(x,y) : s.moveTo(x,y));
  s.closePath();
  return new THREE.ShapeGeometry(s);
};

const SHAPES = [
  poly([[0,.14],[.34,0],[.78,.44],[.34,.92],[0,.78],[.40,.44]]      // chevron
        .map(([x,y]) => [x-0.39, 0.46-y])),
  new THREE.CircleGeometry(0.5, 56),
  poly([[-0.5,-0.42],[0.5,-0.42],[0,0.5]]),                          // triangle
  poly([[0,0.55],[0.46,0],[0,-0.55],[-0.46,0]]),                     // diamond
  new THREE.RingGeometry(0.31, 0.5, 56),
  poly([[-0.5,-0.5],[0.5,-0.5],[0.5,0.5],[-0.5,0.5]]),               // square
];

const INK  = ["#348B90","#984234","#F1DEB4","#AF634A","#C68B6D"];   // never a ground colour

const COUNT   = 34;
const SPACING = 340;     // world units between shapes along the flight

const pieces = [];
const faces  = [];

for (let i = 0; i < COUNT; i++) {
  const geo  = SHAPES[Math.floor(Math.random()*SHAPES.length)];
  const fill = new THREE.Color(INK[i % INK.length]);

  const size = 220 + Math.random()*400;
  const group = new THREE.Group();

  const face = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: fill, side: THREE.DoubleSide }));
  face.scale.set(size, size, 1);
  // a flat colour nobody else uses, so the light pass can tell one shape from another
  face.userData.idMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color((i+1)/(COUNT+2), 0.35 + 0.6*Math.random(), 0.35 + 0.6*Math.random()),
    side: THREE.DoubleSide
  });
  face.userData.artMat = face.material;
  faces.push(face);
  group.add(face);

  group.position.set(
    (Math.random()-0.5) * 620,
    (Math.random()-0.5) * 520,
    -200 - i*SPACING
  );
  scene.add(group);

  pieces.push({
    group,
    face,
    ink: fill.clone(),
    baseX: group.position.x,
    baseZ: group.position.z,
    slide: (Math.random() < 0.5 ? -1 : 1) * (420 + Math.random()*520),  // how far it steps aside
    spin:  (Math.random()-0.5) * 2.4,                                   // how hard it twists
    phase: Math.random() * 6.283,
  });
}

const RUN = COUNT * SPACING;   // the flight loops once it has passed them all

/* ---------------- the press: one screen over the whole frame ---------------- */

var panelLayout = null;

const rtOpts   = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter };
const rtArt    = new THREE.WebGLRenderTarget(1, 1, rtOpts);   // the flat shapes
const rtId     = new THREE.WebGLRenderTarget(1, 1, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
rtId.depthTexture = new THREE.DepthTexture(1, 1);
rtId.depthTexture.minFilter = THREE.NearestFilter;
rtId.depthTexture.magFilter = THREE.NearestFilter;
const rtLit    = new THREE.WebGLRenderTarget(1, 1, rtOpts);   // the shapes once the light is on them

/* ---- the light pass: a rim on the side facing the sun ---- */

const LIGHT_DIR = new THREE.Vector2(-1, 1).normalize();   // the sun sits off the upper left
const RIM_PX    = 26 * DPR;                               // how far the light reaches in

const litUniforms = {
  tArt:  { value: rtArt.texture },
  tId:   { value: rtId.texture },
  tDepth:{ value: rtId.depthTexture },
  uRes:  { value: new THREE.Vector2(1,1) },
  uDir:  { value: LIGHT_DIR },
  uRim:  { value: RIM_PX },
};

const litScene = new THREE.Scene();
litScene.add(new THREE.Mesh(
  new THREE.PlaneGeometry(2,2),
  new THREE.ShaderMaterial({
    uniforms: litUniforms,
    vertexShader: `void main () { gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: /* glsl */`
      precision highp float;
      uniform sampler2D tArt, tId;
      uniform highp sampler2D tDepth;
      uniform vec2  uRes, uDir;
      uniform float uRim;

      const vec3 HILIGHT = vec3(1.000, 0.965, 0.886);

      // three hands the shapes over in linear light. put them back where they
      // were written, so #348B90 in the palette is #348B90 on the screen
      vec3 toSRGB (vec3 c) {
        return mix(c * 12.92,
                   1.055 * pow(max(c, vec3(0.0)), vec3(1.0/2.4)) - 0.055,
                   step(vec3(0.0031308), c));
      }

      void main () {
        vec2 px  = gl_FragCoord.xy;
        vec3 art = toSRGB(texture2D(tArt, px / uRes).rgb);
        vec3 id  = texture2D(tId,  px / uRes).rgb;
        float z  = texture2D(tDepth, px / uRes).r;

        // the paper behind the shapes catches no light
        if (max(max(id.r, id.g), id.b) < 0.02) { gl_FragColor = vec4(art, 1.0); return; }

        // walk toward the sun. this shape's own edge is where it gives way to
        // paper or to something further off - a shape in front of it is not an edge
        float hit = -1.0;
        const int STEPS = 12;
        for (int k = 1; k <= STEPS; k++) {
          float t   = float(k) / float(STEPS);
          vec2  q   = (px + uDir * uRim * t) / uRes;
          vec3  o   = texture2D(tId, q).rgb;
          float oz  = texture2D(tDepth, q).r;
          if (distance(o, id) > 0.02 && oz >= z - 0.00002) { hit = t; break; }
        }

        // crisp where it meets the edge, soft as it bleeds back into the shape
        float rim = hit < 0.0 ? 0.0 : pow(1.0 - hit, 1.7);

        gl_FragColor = vec4(mix(art, HILIGHT, rim * 0.92), 1.0);
      }
    `
  })
));

const post = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

/* the three inks, and the matrix that says how much of each to lay down
   so the printed result comes back to the colour the art asked for */

const INKS = [
  [0.000, 0.647, 0.851],   // cyan
  [0.902, 0.098, 0.451],   // magenta
  [1.000, 0.851, 0.098],   // yellow
];

const separation = (() => {
  // how much of each channel a full covering of each ink takes away
  const A = [0,1,2].map(j => INKS.map(ink => 1 - ink[j]));
  const d = A[0][0]*(A[1][1]*A[2][2] - A[1][2]*A[2][1])
          - A[0][1]*(A[1][0]*A[2][2] - A[1][2]*A[2][0])
          + A[0][2]*(A[1][0]*A[2][1] - A[1][1]*A[2][0]);
  const c = (r0,c0,r1,c1) => A[r0][c0]*A[r1][c1] - A[r0][c1]*A[r1][c0];
  return new THREE.Matrix3().set(
     c(1,1,2,2)/d, -c(0,1,2,2)/d,  c(0,1,1,2)/d,
    -c(1,0,2,2)/d,  c(0,0,2,2)/d, -c(0,0,1,2)/d,
     c(1,0,2,1)/d, -c(0,0,2,1)/d,  c(0,0,1,1)/d
  );
})();

const postUniforms = {
  tScene: { value: rtLit.texture },
  uRes:   { value: new THREE.Vector2(1,1) },
  uPitch: { value: PITCH_CSS * DPR },
  uTime:  { value: 0 },
  uSep:   { value: separation },
  uInk0:  { value: new THREE.Vector3(...INKS[0]) },
  uInk1:  { value: new THREE.Vector3(...INKS[1]) },
  uInk2:  { value: new THREE.Vector3(...INKS[2]) },
};

post.add(new THREE.Mesh(
  new THREE.PlaneGeometry(2,2),
  new THREE.ShaderMaterial({
    uniforms: postUniforms,
    vertexShader: /* glsl */`
      void main () { gl_Position = vec4(position.xy, 0.0, 1.0); }
    `,
    fragmentShader: /* glsl */`
      precision highp float;

      uniform sampler2D tScene;
      uniform vec2  uRes;
      uniform float uPitch;
      uniform float uTime;
      uniform mat3  uSep;
      uniform vec3  uInk0, uInk1, uInk2;

      const vec3 PAPER = vec3(0.969, 0.937, 0.886);


      float hash (vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }

      // ink is never laid down evenly across a sheet
      float weight (vec2 px) {
        vec2 n = px / uRes;
        float w = 1.0
          + 0.13 * sin(n.x * 6.283 * 1.7 + 1.1)
          + 0.11 * sin(n.y * 6.283 * 1.3 + 2.7)
          + 0.09 * sin((n.x + n.y) * 6.283 * 2.1)
          + 0.07 * sin((n.x - n.y) * 6.283 * 5.3 + 4.0)
          + 0.05 * sin(n.y * 6.283 * 9.1 + 0.6);
        // a coarse mottle on top, so no field ever reads as one even tone
        w += 0.06 * (hash(floor(px / 34.0)) - 0.5) * 2.0;
        return w;
      }

      // ink is never laid down evenly across a sheet
      // one plate. the grid is nailed to the screen - the art slides underneath it
      // one screen. it returns the ink it found and how much of the cell that ink covers
      vec4 plate (vec2 px, float angle, float pitch, vec2 slip, vec2 pivot, float seed, float share) {
        float s = sin(angle), c = cos(angle);
        mat2 rot = mat2(c, -s, s, c);
        mat2 inv = mat2(c,  s,-s, c);

        vec2 p    = rot * (px + slip - pivot);   // each screen turns about its own pin
        vec2 cell = floor(p / pitch);
        vec2 mid  = (cell + 0.5) * pitch;

        // the cell reads the art at its own centre, the way a real screen does
        vec2 mid_px = inv * mid + pivot - slip;
        vec3 art    = texture2D(tScene, mid_px / uRes).rgb;

        // split the art into a solid ink and the tint of it that makes this colour.
        // a cream ground comes back as a dark tan ink printed very light
        vec3  gap = max(PAPER - art, vec3(0.0));
        float cov = max(max(gap.r / PAPER.r, gap.g / PAPER.g), gap.b / PAPER.b);
        if (cov <= 0.006) return vec4(0.0);
        vec3  ink = clamp(PAPER - gap / cov, 0.0, 1.0);

        float dens = clamp(cov * weight(mid_px) * share, 0.0, 1.0);
        if (dens <= 0.0) return vec4(0.0);

        // area follows the tint, and no two dots print quite the same.
        // 0.56 of the cell is the most a dot ever grows, so a full field of them
        // touches and merges but never closes - the holes are the lattice
        float jitterR = 0.90 + 0.20 * hash(cell + seed);
        float r = pitch * 0.56 * sqrt(dens) * jitterR;

        // the grid stays dead regular
        float d = length(p - mid);

        return vec4(ink, 1.0 - smoothstep(r - 0.9, r + 0.9, d));
      }

      void main () {
        vec2 px = gl_FragCoord.xy;

        // no two screens are cut to quite the same ruling, and each turns about its own pin
        float D = 0.017453;
        float P = uPitch;

        vec4 a = plate(px, 15.0*D + uTime * 0.0018, P * 1.06, vec2( 0.4,-1.0), uRes * vec2(0.18, 0.72),  3.0, 1.00);
        vec4 b = plate(px, 45.0*D - uTime * 0.0014, P * 0.97, vec2(-1.4,-0.6), uRes * vec2(0.83, 0.21), 17.0, 0.18);
        vec4 e = plate(px, 75.0*D + uTime * 0.0010, P * 1.02, vec2( 1.2, 0.8), uRes * vec2(0.41, 0.09), 41.0, 0.18);

        vec3 col = PAPER;
        col = mix(col, a.rgb, a.a);
        col = mix(col, b.rgb, b.a);
        col = mix(col, e.rgb, e.a);

        gl_FragColor = vec4(col, 1.0);
      }
    `
  })
));

/* ---------------- the flight ---------------- */

const ID_BG = new THREE.Color(0, 0, 0);   // no shape prints pure black in the id pass

let target = 0, travel = 0;

function maxScroll () { return document.body.scrollHeight - innerHeight; }

function resize () {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const bw = Math.floor(w * DPR), bh = Math.floor(h * DPR);
  rtArt.setSize(bw, bh);
  rtId.setSize(bw, bh);
  rtLit.setSize(bw, bh);
  litUniforms.uRes.value.set(bw, bh);
  if (panelLayout) panelLayout();
  postUniforms.uRes.value.set(bw, bh);
}
addEventListener("resize", resize);
resize();

addEventListener("scroll", () => {
  target = scrollY * PER_PIXEL;
  panel.visible = false;     // moving again takes the window away
}, { passive:true });

const dial = document.getElementById("pitch");
const dialVal = document.getElementById("pitchVal");
// always the same number of glyphs, so no digit ever moves
const reading = (v) => parseFloat(v).toFixed(1).padStart(4, "0");

dial.value = PITCH_CSS;
dialVal.textContent = reading(PITCH_CSS);
dial.addEventListener("input", () => {
  postUniforms.uPitch.value = parseFloat(dial.value) * DPR;
  dialVal.textContent = reading(dial.value);
});

/* ---- dragging: pick a shape up and put it somewhere else ---- */

for (const p of pieces) p.group.children[0].userData.piece = p;

const FLASH = new THREE.Color("#241812");   // dark, so a cream shape flashes too
const ray     = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const plane   = new THREE.Plane();
const hitPt   = new THREE.Vector3();
let held = null, target2 = null, grabDX = 0, grabDY = 0;

const draggable = () => faces.filter(f => f.userData.piece);

// the shape under the pointer that is not the one in hand
function under (skip) {
  const hits = ray.intersectObjects(draggable(), false);
  for (const h of hits) if (h.object.userData.piece !== skip) return h.object.userData.piece;
  return null;
}

function toNDC (e) {
  pointer.x =  (e.clientX / innerWidth)  * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
}

renderer.domElement.addEventListener("pointerdown", (e) => {
  toNDC(e);
  ray.setFromCamera(pointer, camera);
  const hit = ray.intersectObjects(draggable(), false)[0];
  if (!hit) return;

  held = hit.object.userData.piece;
  plane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0,0,1), held.group.position);
  ray.ray.intersectPlane(plane, hitPt);
  grabDX = held.group.position.x - hitPt.x;
  grabDY = held.group.position.y - hitPt.y;
  lift(held, true);
  renderer.domElement.setPointerCapture(e.pointerId);
  renderer.domElement.style.cursor = "grabbing";
});

renderer.domElement.addEventListener("pointermove", (e) => {
  toNDC(e);
  ray.setFromCamera(pointer, camera);

  // the hand shows over anything that can be picked up
  if (!held) {
    renderer.domElement.style.cursor = under(null) ? "grab" : "";
    return;
  }

  if (!ray.ray.intersectPlane(plane, hitPt)) return;

  const x = hitPt.x + grabDX;
  held.group.position.x = x;
  held.group.position.y = hitPt.y + grabDY;
  // put the step-aside back in step with where it was dropped
  held.baseX = x - held.slide * (held.eased || 0);

  // whatever it is being dragged over starts blinking
  const over = under(held);
  if (over !== target2) {
    if (target2) target2.face.material.color.copy(target2.ink);
    target2 = over;
  }
});

// the shape in hand rides over everything it meets, whatever depth it is at
function lift (p, up) {
  p.face.renderOrder = up ? 500 : 0;
  for (const mat of [p.face.userData.artMat, p.face.userData.idMat]) {
    mat.depthTest  = !up;
    mat.depthWrite = !up;
  }
}

const drop = () => {
  if (held) lift(held, false);
  if (held && target2) join(held, target2);
  if (target2) { target2.face.material.color.copy(target2.ink); target2 = null; }
  held = null;
  renderer.domElement.style.cursor = "";
};
renderer.domElement.addEventListener("pointerup", drop);
renderer.domElement.addEventListener("pointercancel", drop);

/* ---- two shapes joining, and the burst that marks it ---- */

const STAR = (() => {
  const pts = [];
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    const r = i % 2 ? 0.18 : 0.5;
    pts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  return poly(pts);
})();

const bursts = [];

/* ---- the window that pops up on a join. it rides with the camera, so the
   screen prints over it the same as the shapes ---- */

const PANEL_Z = 600;   // how far ahead of the camera the window sits

const panel = new THREE.Group();
panel.position.z = -PANEL_Z;
panel.visible = false;
camera.add(panel);
scene.add(camera);

const slab = (colour, z) => {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(colour), side: THREE.DoubleSide })
  );
  m.position.z = z;
  m.userData.artMat = m.material;
  m.userData.idMat  = new THREE.MeshBasicMaterial({
    color: new THREE.Color(0.2 + Math.random() * 0.7, Math.random(), 0.4 + Math.random() * 0.5),
    side: THREE.DoubleSide
  });
  // the window sits over every shape, whatever depth they are at, and still
  // goes into the same buffer, so the screen prints over it like the rest
  m.renderOrder = 1000 + z;
  for (const mat of [m.userData.artMat, m.userData.idMat]) {
    mat.depthTest = false;
    mat.depthWrite = false;
  }
  faces.push(m);
  panel.add(m);
  return m;
};

const pShadow = slab("#B04A38", 0);
const pRule   = slab("#4A362B", 1);
const pFace   = slab("#FCE4B4", 2);
const pThumbR = slab("#4A362B", 3);

new THREE.TextureLoader().load(PHOTO, (tex) => {
  tex.colorSpace = THREE.SRGBColorSpace;
  // fill the square without squashing it
  const a = tex.image.width / tex.image.height;
  if (a > 1) { tex.repeat.set(1 / a, 1); tex.offset.set((1 - 1 / a) / 2, 0); }
  else       { tex.repeat.set(1, a);     tex.offset.set(0, (1 - a) / 2); }
  pThumb.material.map = tex;
  pThumb.material.needsUpdate = true;
});
// the words, lifted off pietsuess.com
const PANEL_HEAD = "Piet Suess";
const PANEL_TEXT = "Creative Director & Post-Production Veteran. 30+ years across directing, editing, photography, animation, and brand design. Creative direction portfolio \u2014 Music videos, short films, ads, and promotional content by Piet Suess. Editing portfolio \u2014 30+ years of post-production expertise across advertising, documentary, and branded content.";

const textCanvas = document.createElement("canvas");
const textTex    = new THREE.CanvasTexture(textCanvas);
textTex.minFilter = THREE.LinearFilter;
const pText = slab("#FFFFFF", 5);
pText.material = new THREE.MeshBasicMaterial({
  map: textTex, transparent: true, side: THREE.DoubleSide, depthTest: false, depthWrite: false
});
pText.userData.artMat = pText.material;

function drawPanelText (w, h) {
  const S = 2;
  textCanvas.width  = Math.max(8, Math.round(w * S));
  textCanvas.height = Math.max(8, Math.round(h * S));
  const c = textCanvas.getContext("2d");
  c.clearRect(0, 0, textCanvas.width, textCanvas.height);

  const CW = textCanvas.width, CH = textCanvas.height;
  c.fillStyle = "#4A362B";
  c.textBaseline = "top";

  const FACE = ' Impact, Haettenschweiler, "Arial Black", sans-serif';

  const wrap = (text, size) => {
    c.font = "900 " + size + "px" + FACE;
    const lines = [];
    let line = "";
    for (const word of text.split(" ")) {
      const test = line ? line + " " + word : word;
      if (c.measureText(test).width > CW && line) { lines.push(line); line = word; }
      else line = test;
    }
    if (line) lines.push(line);
    return lines;
  };

  const fits = (text, size, room) => {
    const l = wrap(text, size);
    return l.length * size * 1.16 <= room && !l.some(x => c.measureText(x).width > CW);
  };

  // the heading takes the top, the body comes down until it fits under it
  let hs = CH * 0.15;
  while (hs > 6 && !fits(PANEL_HEAD, hs, CH * 0.24)) hs *= 0.94;
  const headLines = wrap(PANEL_HEAD, hs);
  const headBlock = headLines.length * hs * 1.16;

  const room = CH - headBlock - CH * 0.06;
  let bs = CH * 0.085;
  while (bs > 4 && !fits(PANEL_TEXT, bs, room)) bs *= 0.94;
  const bodyLines = wrap(PANEL_TEXT, bs);

  let y = 0;
  c.font = "900 " + hs + "px" + FACE;
  for (const l of headLines) { c.fillText(l, 0, y); y += hs * 1.16; }

  y += CH * 0.06;
  c.font = "900 " + bs + "px" + FACE;
  for (const l of bodyLines) { c.fillText(l, 0, y); y += bs * 1.16; }

  textTex.needsUpdate = true;
}

function layoutPanel () {
  // the window is the frame, less a small inset
  const h = 2 * PANEL_Z * Math.tan((camera.fov * Math.PI / 180) / 2);
  const w = h * camera.aspect;
  const H = h * 0.90, W = w * 0.94;

  const E   = H * 0.020;
  const PAD = H * 0.070;
  const T   = Math.min(H - PAD * 2, W * 0.34);

  const put = (m, mw, mh, x, y) => { m.scale.set(mw, mh, 1); m.position.x = x; m.position.y = y; };

  put(pShadow, W, H,  E * 1.6, -E * 1.6);
  put(pRule,   W + E * 2, H + E * 2, 0, 0);
  put(pFace,   W, H, 0, 0);

  const tx = -W / 2 + PAD + T / 2;
  put(pThumbR, T + E, T + E, tx, 0);
  put(pThumb,  T, T, tx, 0);

  const bx   = tx + T / 2 + PAD;
  const room = (W / 2 - PAD) - bx;
  const th   = T;
  put(pText, room, th, bx + room / 2, 0);
  drawPanelText(room, th);
}
var panelLayout = layoutPanel;
layoutPanel();

function showPanel () { panel.visible = true; }

function burst (at, colour) {
  // big enough to swallow the frame at the depth it goes off
  const d = Math.max(camera.position.z - at.z, 1);
  const h = 2 * d * Math.tan((camera.fov * Math.PI / 180) / 2);
  const size = Math.max(h, h * camera.aspect) * 2.6;
  const m = new THREE.Mesh(STAR, new THREE.MeshBasicMaterial({ color: colour, side: THREE.DoubleSide }));
  m.position.copy(at);
  m.scale.set(size * 0.3, size * 0.3, 1);
  m.userData.artMat = m.material;
  m.userData.idMat  = new THREE.MeshBasicMaterial({
    color: new THREE.Color(0.5, 0.2 + Math.random() * 0.7, 0.9), side: THREE.DoubleSide
  });
  scene.add(m);
  faces.push(m);
  bursts.push({ mesh: m, born: clock.getElapsedTime(), size });
}

/* ---- zap bop ---- */

let audio = null;
function zapBop () {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  const t = audio.currentTime;

  // the zap: a saw falling fast
  const zap = audio.createOscillator(), zg = audio.createGain();
  zap.type = "sawtooth";
  zap.frequency.setValueAtTime(700, t);
  zap.frequency.exponentialRampToValueAtTime(60, t + 0.16);
  zg.gain.setValueAtTime(0.38, t);
  zg.gain.exponentialRampToValueAtTime(0.0008, t + 0.20);
  zap.connect(zg).connect(audio.destination);
  zap.start(t); zap.stop(t + 0.22);

  // the bop: a short round thump under it
  const bop = audio.createOscillator(), bg = audio.createGain();
  bop.type = "sine";
  bop.frequency.setValueAtTime(150, t + 0.09);
  bop.frequency.exponentialRampToValueAtTime(34, t + 0.45);
  bg.gain.setValueAtTime(0.0001, t + 0.09);
  bg.gain.exponentialRampToValueAtTime(0.62, t + 0.12);
  bg.gain.exponentialRampToValueAtTime(0.0008, t + 0.55);
  bop.connect(bg).connect(audio.destination);
  bop.start(t + 0.09); bop.stop(t + 0.56);

  // the bell: a bright ping that rings on over the thump, two notes up
  const ring = (f, at, level, life) => {
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(f, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(level, at + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0004, at + life);
    o.connect(g).connect(audio.destination);
    o.start(at); o.stop(at + life + 0.02);
  };

  // first strike, with its inharmonic partials
  ring(1318, t + 0.02, 0.16, 1.30);
  ring(2637, t + 0.02, 0.07, 0.90);
  ring(3550, t + 0.02, 0.04, 0.55);

  // and the note it cheers up to
  ring(1976, t + 0.15, 0.13, 1.20);
  ring(3951, t + 0.15, 0.05, 0.70);
}

/* ---- a shape, made at runtime the same way the first ones were ---- */

function spawn (geo, fill, size, at, rotZ) {
  const group = new THREE.Group();
  const face  = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: fill, side: THREE.DoubleSide }));
  face.scale.set(size, size, 1);
  face.userData.artMat = face.material;
  face.userData.idMat  = new THREE.MeshBasicMaterial({
    color: new THREE.Color(Math.random(), 0.35 + 0.6 * Math.random(), 0.35 + 0.6 * Math.random()),
    side: THREE.DoubleSide
  });
  faces.push(face);
  group.add(face);
  group.position.copy(at);
  group.rotation.z = rotZ;
  scene.add(group);

  const piece = {
    group, face,
    ink: fill.clone(),
    baseX: at.x,
    baseZ: at.z,
    slide: (Math.random() < 0.5 ? -1 : 1) * (420 + Math.random() * 520),
    spin:  (Math.random() - 0.5) * 2.4,
    phase: rotZ,
  };
  face.userData.piece = piece;
  pieces.push(piece);
  return piece;
}

function retire (p) {
  scene.remove(p.group);
  const i = faces.indexOf(p.face);
  if (i >= 0) faces.splice(i, 1);
  const j = pieces.indexOf(p);
  if (j >= 0) pieces.splice(j, 1);
}

// both go, and one new shape is left where they met
function join (a, b) {
  const mid  = a.group.position.clone().add(b.group.position).multiplyScalar(0.5);
  // the average of the two, never bigger than the shapes it started with
  const size = Math.min((a.face.scale.x + b.face.scale.x) * 0.5, 620);

  burst(mid, new THREE.Color("#FFFFFF"));
  showPanel();
  zapBop();

  retire(a);
  retire(b);

  spawn(
    SHAPES[Math.floor(Math.random() * SHAPES.length)],
    a.ink.clone(),
    size,
    mid,
    (Math.random() - 0.5) * 0.9
  );
}

const clock = new THREE.Clock();

function frame () {
  const now = clock.getElapsedTime();
  postUniforms.uTime.value = now;

  // the ground drifts from one card colour to the next
  const g  = (now * 0.045) % GROUNDS.length;
  const i0 = Math.floor(g);
  const i1 = (i0 + 1) % GROUNDS.length;
  scene.background.copy(GROUNDS[i0]).lerp(GROUNDS[i1], g - i0);
  travel += (target - travel) * EASE;

  // the shapes recycle so the run never simply ends
  camera.position.z = 200 - (travel % RUN);

  // the shape being dragged over blinks
  if (target2) {
    const on = Math.sin(now * 26.0) > 0.0;
    target2.face.material.color.copy(on ? FLASH : target2.ink);
  }

  // the bursts open out and go
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i];
    const t = (now - b.born) / 0.22;
    if (t >= 1) {
      scene.remove(b.mesh);
      faces.splice(faces.indexOf(b.mesh), 1);
      bursts.splice(i, 1);
      continue;
    }
    const k = b.size * (0.04 + 0.96 * t);
    b.mesh.scale.set(k, k, 1);
    b.mesh.rotation.z = t * 0.7;
  }

  // each piece steps aside and twists as the flight closes on it
  for (const p of pieces) {
    const dist  = p.baseZ - camera.position.z;              // negative once it is behind
    const near  = 1.0 - Math.min(Math.abs(dist) / 1500, 1); // 0 far off, 1 right here
    const eased = near * near * (3 - 2*near);
    p.eased = eased;
    if (p !== held) p.group.position.x = p.baseX + p.slide * eased;
    p.group.rotation.z = p.phase + p.spin * eased * 1.6;
  }

  renderer.setRenderTarget(rtArt);
  renderer.render(scene, camera);

  for (const f of faces) f.material = f.userData.idMat;
  const bg = scene.background;
  scene.background = ID_BG;
  renderer.setRenderTarget(rtId);
  renderer.render(scene, camera);
  scene.background = bg;
  for (const f of faces) f.material = f.userData.artMat;

  renderer.setRenderTarget(rtLit);
  renderer.render(litScene, postCam);

  renderer.setRenderTarget(null);
  renderer.render(post, postCam);

  requestAnimationFrame(frame);
}
frame();
</script>
