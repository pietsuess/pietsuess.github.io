<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya &amp; Madsen &mdash; Wedding Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=EB+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<script src="photos.js"></script>
<style>
  :root{
    --bg-deep:#012130;
    --bg:#013246;
    --bg-light:#0a4a60;
    --cream:#f3ecdd;
    --cream-dim:#cdd6d6;
    --line:rgba(243,236,221,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg-deep);}
  body{
    font-family:'EB Garamond',Georgia,serif;
    color:var(--cream);
    min-height:100vh;
    background:
      radial-gradient(120% 80% at 50% -10%, var(--bg-light) 0%, var(--bg) 38%, var(--bg-deep) 100%);
    background-attachment:fixed;
    position:relative;
    overflow-x:hidden;
  }
  /* starfield layer (generated by JS) */
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  .content{position:relative;z-index:1;}

  header{
    text-align:center;
    padding:clamp(3.5rem,9vw,7rem) 1.5rem clamp(2rem,4vw,3rem);
  }
  header h1{
    font-family:'Instrument Serif',serif;
    font-weight:400;
    font-size:clamp(3rem,9vw,7.5rem);
    line-height:1;
    letter-spacing:.06em;
    color:var(--cream);
  }
  header .date{
    margin-top:1.4rem;
    font-size:clamp(.85rem,1.6vw,1.05rem);
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--cream-dim);
    font-weight:400;
  }
  header .rule{
    width:min(420px,60vw);
    height:1px;
    background:var(--line);
    margin:2.4rem auto 0;
  }
  header .caption{
    margin-top:1.6rem;
    font-style:italic;
    font-size:clamp(1rem,1.8vw,1.3rem);
    color:var(--cream-dim);
  }

  main{
    width:100%;
    padding:clamp(1.5rem,4vw,3.5rem) clamp(1rem,4vw,4rem) 5rem;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:clamp(.6rem,1.4vw,1.4rem);
    width:100%;
  }
  .tile{
    position:relative;
    overflow:hidden;
    cursor:zoom-in;
    background:#021a26;
    aspect-ratio:2/3;
    border:1px solid rgba(243,236,221,.08);
  }
  .tile img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    transition:transform .6s cubic-bezier(.2,.7,.2,1), opacity .6s ease;
    opacity:0;
  }
  .tile img.loaded{opacity:1;}
  .tile:hover img{transform:scale(1.045);}
  .tile::after{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(1,33,48,0) 55%,rgba(1,33,48,.35) 100%);
    opacity:0;transition:opacity .4s ease;pointer-events:none;
  }
  .tile:hover::after{opacity:1;}

  .empty{grid-column:1/-1;text-align:center;padding:4rem 0;color:var(--cream-dim);font-style:italic;}

  footer{
    text-align:center;padding:0 1.5rem 4rem;
    color:var(--cream-dim);font-size:.85rem;letter-spacing:.22em;text-transform:uppercase;
  }

  /* Lightbox */
  #lb{
    position:fixed;inset:0;z-index:50;
    background:rgba(1,18,27,.94);
    backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;
    opacity:0;transition:opacity .3s ease;
  }
  #lb.open{display:flex;opacity:1;}
  #lb img{
    max-width:92vw;max-height:88vh;
    object-fit:contain;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    user-select:none;
    cursor:zoom-in;
    transform-origin:center center;
    transition:transform .18s ease;
    will-change:transform;
    touch-action:none;
  }
  #lb.zoomed img{cursor:grab;}
  #lb.panning img{cursor:grabbing;transition:none;}
  #lb.zoomed .nav{opacity:0;pointer-events:none;}
  #lb .hint{
    position:absolute;top:1.4rem;left:1.8rem;
    color:var(--cream-dim);letter-spacing:.18em;font-size:.7rem;
    text-transform:uppercase;opacity:.6;pointer-events:none;
  }
  #lb .nav{
    position:absolute;top:0;bottom:0;width:22%;
    display:flex;align-items:center;cursor:pointer;
    color:var(--cream);font-size:2.4rem;border:0;background:none;
    opacity:.55;transition:opacity .2s ease;
  }
  #lb .nav:hover{opacity:1;}
  #lb .prev{left:0;justify-content:flex-start;padding-left:2rem;}
  #lb .next{right:0;justify-content:flex-end;padding-right:2rem;}
  #lb .close{
    position:absolute;top:1.4rem;right:1.8rem;
    background:none;border:0;color:var(--cream);
    font-size:2rem;cursor:pointer;opacity:.7;line-height:1;
  }
  #lb .close:hover{opacity:1;}
  #lb .counter{
    position:absolute;bottom:1.6rem;left:0;right:0;text-align:center;
    color:var(--cream-dim);letter-spacing:.3em;font-size:.8rem;
  }

  @media (max-width:600px){
    .grid{grid-template-columns:repeat(2,1fr);}
    #lb .nav{font-size:1.6rem;width:28%;}
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="content">
  <header>
    <h1>Maya &amp; Madsen</h1>
    <div class="date">June 13, 2026 &nbsp;&bull;&nbsp; Brant, Canada</div>
    <div class="rule"></div>
    <div class="caption">A summer garden party</div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer>Photographs by Piet Suess</footer>
</div>

<!-- Lightbox -->
<div id="lb" aria-hidden="true">
  <button class="close" aria-label="Close">&times;</button>
  <button class="nav prev" aria-label="Previous">&#8249;</button>
  <img id="lbImg" alt="">
  <button class="nav next" aria-label="Next">&#8250;</button>
  <div class="counter" id="lbCount"></div>
  <div class="hint">Scroll to zoom &middot; drag to pan</div>
</div>

<script>
const PHOTOS_DIR = 'Jpgs/';
const THUMBS_DIR = 'thumbs/';
let photos = [];
let current = 0;

function load(){
  const grid = document.getElementById('grid');
  photos = Array.isArray(window.PHOTOS) ? window.PHOTOS : [];

  if(!photos.length){
    grid.innerHTML = '<div class="empty">Photos coming soon.</div>';
    return;
  }

  photos.forEach((name, i)=>{
    const tile = document.createElement('div');
    tile.className = 'tile';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = THUMBS_DIR + name;
    img.alt = 'Maya & Madsen wedding photo ' + (i+1);
    img.addEventListener('load', ()=> img.classList.add('loaded'));
    tile.appendChild(img);
    tile.addEventListener('click', ()=> openLightbox(i));
    grid.appendChild(tile);
  });
}

// Lightbox
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');
const lbCount = document.getElementById('lbCount');

// zoom state
let scale = 1, tx = 0, ty = 0;
const MIN = 1, MAX = 5;
const clamp = (v,a,b)=> Math.max(a, Math.min(b, v));

function applyTransform(){
  lbImg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  lb.classList.toggle('zoomed', scale > 1.001);
}
function clampPan(){
  const bw = lbImg.clientWidth * scale, bh = lbImg.clientHeight * scale;
  const mx = Math.max(0, (bw - window.innerWidth) / 2 + 24);
  const my = Math.max(0, (bh - window.innerHeight) / 2 + 24);
  tx = clamp(tx, -mx, mx);
  ty = clamp(ty, -my, my);
}
function resetZoom(){ scale = 1; tx = 0; ty = 0; applyTransform(); }

function zoomTo(newScale, cx, cy){
  const C0x = window.innerWidth / 2, C0y = window.innerHeight / 2;
  const ax = cx - C0x, ay = cy - C0y;
  const ns = clamp(newScale, MIN, MAX);
  const r = ns / scale;
  tx = ax * (1 - r) + tx * r;
  ty = ay * (1 - r) + ty * r;
  scale = ns;
  if (scale === 1){ tx = 0; ty = 0; }
  clampPan();
  applyTransform();
}

function openLightbox(i){
  current = i;
  showCurrent();
  lb.classList.add('open');
  lb.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
}
function showCurrent(){
  lbImg.src = PHOTOS_DIR + photos[current];
  lbCount.textContent = (current+1) + ' / ' + photos.length;
  resetZoom();
}
function closeLightbox(){
  lb.classList.remove('open');
  lb.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  resetZoom();
}
function step(dir){
  current = (current + dir + photos.length) % photos.length;
  showCurrent();
}

document.querySelector('#lb .close').addEventListener('click', closeLightbox);
document.querySelector('#lb .prev').addEventListener('click', e=>{e.stopPropagation();step(-1);});
document.querySelector('#lb .next').addEventListener('click', e=>{e.stopPropagation();step(1);});

// backdrop click closes (but not when clicking the image)
lb.addEventListener('click', e=>{ if(e.target === lb) closeLightbox(); });

// wheel / trackpad pinch to zoom toward cursor
lb.addEventListener('wheel', e=>{
  if(!lb.classList.contains('open')) return;
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0018);
  zoomTo(scale * factor, e.clientX, e.clientY);
}, {passive:false});

// drag to pan when zoomed; click (no drag) toggles 2x zoom
let dragging = false, moved = false, sx = 0, sy = 0, stx = 0, sty = 0;
lbImg.addEventListener('mousedown', e=>{
  e.preventDefault();
  dragging = true; moved = false;
  sx = e.clientX; sy = e.clientY; stx = tx; sty = ty;
  if(scale > 1) lb.classList.add('panning');
});
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  if(Math.abs(e.clientX - sx) > 3 || Math.abs(e.clientY - sy) > 3) moved = true;
  if(scale > 1){
    tx = stx + (e.clientX - sx);
    ty = sty + (e.clientY - sy);
    clampPan();
    applyTransform();
  }
});
window.addEventListener('mouseup', e=>{
  if(!dragging) return;
  dragging = false;
  lb.classList.remove('panning');
  if(!moved){
    if(scale === 1) zoomTo(2.2, e.clientX, e.clientY);
    else resetZoom();
  }
});
lbImg.addEventListener('dblclick', e=>{
  e.preventDefault();
  if(scale === 1) zoomTo(2.6, e.clientX, e.clientY); else resetZoom();
});

document.addEventListener('keydown', e=>{
  if(!lb.classList.contains('open')) return;
  if(e.key === 'Escape'){ if(scale>1) resetZoom(); else closeLightbox(); }
  if(e.key === 'ArrowLeft') step(-1);
  if(e.key === 'ArrowRight') step(1);
  if(e.key === '0') resetZoom();
});

// Starfield
(function(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let stars = [];
  function seed(){
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    const count = Math.round((c.width * c.height) / 6500);
    stars = Array.from({length:count}, ()=>({
      x: Math.random()*c.width,
      y: Math.random()*c.height,
      r: Math.random()*1.4 + .2,
      a: Math.random()*.6 + .2,
      tw: Math.random()*.02 + .004,
      p: Math.random()*Math.PI*2
    }));
  }
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    for(const s of stars){
      s.p += s.tw;
      const alpha = s.a * (0.6 + 0.4*Math.sin(s.p));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(243,236,221,'+alpha.toFixed(3)+')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  seed(); draw();
  window.addEventListener('resize', seed);
})();

load();
</script>
</body>
</html>
